<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5b5ce2">
  <meta name="description" content="Create or join a simple collaborative whiteboard with a four-character code. A free Bright Arcade educational activity for primary students.">
  <title>Whiteboard | Bright Arcade</title>
  <style>
    :root {
      --ink: #182135;
      --muted: #667085;
      --purple: #5b5ce2;
      --purple-dark: #4647c7;
      --yellow: #ffd84d;
      --pink: #ff70a6;
      --blue: #58c7ff;
      --green: #50d890;
      --paper: #ffffff;
      --soft: #f4f6ff;
      --line: #dfe4f2;
      --danger: #d92d20;
      --shadow: 0 18px 50px rgba(38, 43, 84, 0.16);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      font-family: "Arial Rounded MT Bold", "Trebuchet MS", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 15%, rgba(255, 216, 77, 0.38), transparent 26%),
        radial-gradient(circle at 85% 10%, rgba(88, 199, 255, 0.32), transparent 25%),
        radial-gradient(circle at 80% 88%, rgba(255, 112, 166, 0.24), transparent 27%),
        linear-gradient(145deg, #f7f7ff 0%, #eef5ff 100%);
    }

    body {
      min-height: 100dvh;
      overflow: hidden;
    }

    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .screen {
      display: none;
      width: 100%;
      min-height: 100dvh;
    }

    .screen.active { display: flex; }

    /* ---------- HOME ---------- */
    #homeScreen {
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-y: auto;
    }

    .home-card {
      width: min(760px, 100%);
      background: rgba(255, 255, 255, 0.94);
      border: 3px solid rgba(255,255,255,0.9);
      border-radius: 34px;
      box-shadow: var(--shadow);
      padding: clamp(26px, 5vw, 54px);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .home-card::before,
    .home-card::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      pointer-events: none;
    }

    .home-card::before {
      width: 170px;
      height: 170px;
      background: rgba(80, 216, 144, 0.18);
      top: -76px;
      left: -62px;
    }

    .home-card::after {
      width: 200px;
      height: 200px;
      background: rgba(255, 112, 166, 0.14);
      right: -82px;
      bottom: -92px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--purple);
      font-weight: 900;
      letter-spacing: -0.6px;
      font-size: clamp(20px, 4vw, 27px);
      position: relative;
      z-index: 1;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: var(--yellow);
      box-shadow: inset 0 -4px 0 rgba(0,0,0,0.08);
      transform: rotate(-4deg);
      font-size: 24px;
    }

    .board-icon {
      width: clamp(105px, 19vw, 145px);
      aspect-ratio: 1;
      margin: 30px auto 20px;
      border-radius: 34px;
      background: linear-gradient(145deg, #6f70f2, #4e4fd2);
      box-shadow: 0 14px 0 rgba(70, 71, 199, 0.18), 0 22px 42px rgba(91,92,226,0.28);
      display: grid;
      place-items: center;
      position: relative;
      transform: rotate(-2deg);
    }

    .board-icon::before {
      content: "";
      width: 68%;
      height: 54%;
      border-radius: 13px;
      background: #fff;
      box-shadow: inset 0 0 0 4px rgba(24,33,53,0.08);
    }

    .board-icon::after {
      content: "✏️";
      position: absolute;
      font-size: clamp(36px, 7vw, 54px);
      transform: rotate(-13deg) translate(13px, 5px);
    }

    h1 {
      margin: 10px 0 10px;
      font-size: clamp(38px, 8vw, 68px);
      line-height: 0.98;
      letter-spacing: -2.4px;
      color: var(--ink);
      position: relative;
      z-index: 1;
    }

    .tagline {
      margin: 0 auto 30px;
      max-width: 520px;
      color: var(--muted);
      font-family: "Trebuchet MS", Arial, sans-serif;
      font-weight: 700;
      font-size: clamp(17px, 3vw, 21px);
      line-height: 1.45;
      position: relative;
      z-index: 1;
    }

    .home-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      position: relative;
      z-index: 1;
    }

    .big-button {
      min-height: 82px;
      border: 0;
      border-radius: 22px;
      padding: 16px 18px;
      cursor: pointer;
      font-size: clamp(19px, 3vw, 24px);
      font-weight: 900;
      transition: transform 140ms ease, box-shadow 140ms ease, opacity 140ms ease;
    }

    .big-button:hover:not(:disabled) { transform: translateY(-3px); }
    .big-button:active:not(:disabled) { transform: translateY(1px); }
    .big-button:disabled { opacity: 0.48; cursor: not-allowed; }

    .primary-button {
      color: #fff;
      background: var(--purple);
      box-shadow: 0 8px 0 var(--purple-dark);
    }

    .secondary-button {
      color: var(--ink);
      background: var(--yellow);
      box-shadow: 0 8px 0 #e6bd25;
    }

    .connection-message {
      min-height: 24px;
      margin-top: 24px;
      color: var(--muted);
      font-family: "Trebuchet MS", Arial, sans-serif;
      font-weight: 700;
      position: relative;
      z-index: 1;
    }

    .connection-message.error { color: var(--danger); }
    .connection-message.ready { color: #08783e; }

    /* ---------- MODAL ---------- */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(18, 25, 46, 0.56);
      backdrop-filter: blur(6px);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      width: min(430px, 100%);
      border-radius: 28px;
      background: #fff;
      box-shadow: 0 30px 80px rgba(15, 23, 42, 0.32);
      padding: 30px;
      text-align: center;
    }

    .modal h2 {
      margin: 0 0 8px;
      font-size: 32px;
      letter-spacing: -1px;
    }

    .modal p {
      margin: 0 0 22px;
      color: var(--muted);
      font-family: "Trebuchet MS", Arial, sans-serif;
      font-weight: 700;
    }

    .code-input {
      width: 100%;
      height: 86px;
      border: 4px solid var(--line);
      border-radius: 20px;
      outline: none;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 18px;
      padding-left: 18px;
      font-size: 42px;
      font-weight: 900;
      color: var(--ink);
      background: var(--soft);
      transition: border-color 130ms ease, box-shadow 130ms ease;
    }

    .code-input:focus {
      border-color: var(--purple);
      box-shadow: 0 0 0 5px rgba(91,92,226,0.14);
    }

    .modal-error {
      min-height: 22px;
      color: var(--danger);
      margin: 10px 0 6px;
      font-family: "Trebuchet MS", Arial, sans-serif;
      font-weight: 700;
    }

    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1.35fr;
      gap: 12px;
      margin-top: 10px;
    }

    .modal-button {
      min-height: 58px;
      border: 0;
      border-radius: 16px;
      cursor: pointer;
      font-weight: 900;
      font-size: 18px;
    }

    .modal-button.cancel { background: #eef1f7; color: var(--ink); }
    .modal-button.join { background: var(--purple); color: #fff; }
    .modal-button:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ---------- BOARD ---------- */
    #boardScreen {
      flex-direction: column;
      background: #dbe7ff;
      overflow: hidden;
    }

    .topbar {
      min-height: 72px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: max(10px, env(safe-area-inset-top)) 16px 10px;
      background: #fff;
      border-bottom: 2px solid var(--line);
      box-shadow: 0 4px 16px rgba(24,33,53,0.08);
      z-index: 5;
    }

    .topbar .brand {
      font-size: 20px;
      flex-shrink: 0;
    }

    .topbar .brand-mark {
      width: 36px;
      height: 36px;
      font-size: 20px;
      border-radius: 12px;
    }

    .join-code-box {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: auto;
      padding: 7px 9px 7px 13px;
      background: var(--soft);
      border: 2px solid var(--line);
      border-radius: 16px;
      white-space: nowrap;
    }

    .join-code-label {
      color: var(--muted);
      font-family: "Trebuchet MS", Arial, sans-serif;
      font-weight: 800;
      font-size: 13px;
    }

    .join-code-value {
      font-size: 25px;
      letter-spacing: 3px;
      font-weight: 900;
      color: var(--purple);
    }

    .copy-button,
    .leave-button {
      border: 0;
      border-radius: 12px;
      min-height: 42px;
      padding: 0 13px;
      cursor: pointer;
      font-weight: 900;
    }

    .copy-button { background: var(--yellow); color: var(--ink); }
    .leave-button { background: #eef1f7; color: var(--ink); }

    .people-count {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #08783e;
      font-family: "Trebuchet MS", Arial, sans-serif;
      font-weight: 900;
      white-space: nowrap;
    }

    .online-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #16a34a;
      box-shadow: 0 0 0 4px rgba(22,163,74,0.13);
    }

    .board-main {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 12px;
      background: rgba(255,255,255,0.96);
      border-bottom: 2px solid var(--line);
      overflow-x: auto;
      scrollbar-width: none;
      z-index: 4;
    }

    .toolbar::-webkit-scrollbar { display: none; }

    .tool-button {
      min-width: 52px;
      height: 48px;
      border: 2px solid var(--line);
      border-radius: 14px;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      font-size: 22px;
      font-weight: 900;
      flex-shrink: 0;
      transition: transform 120ms ease, border-color 120ms ease, background 120ms ease;
    }

    .tool-button:hover:not(:disabled) { transform: translateY(-2px); }
    .tool-button.active {
      border-color: var(--purple);
      background: #ececff;
      box-shadow: 0 0 0 3px rgba(91,92,226,0.10);
    }
    .tool-button:disabled { opacity: 0.35; cursor: not-allowed; }
    .tool-button.danger { color: var(--danger); }

    .divider {
      width: 2px;
      height: 34px;
      background: var(--line);
      margin: 0 2px;
      flex-shrink: 0;
    }

    .colour-button {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 4px solid #fff;
      outline: 2px solid var(--line);
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 120ms ease, outline-color 120ms ease;
    }

    .colour-button:hover { transform: scale(1.08); }
    .colour-button.active {
      outline-color: var(--ink);
      transform: scale(1.08);
    }

    .canvas-area {
      flex: 1;
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 10px;
      overflow: hidden;
      position: relative;
      background:
        linear-gradient(45deg, rgba(255,255,255,0.28) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(255,255,255,0.28) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(255,255,255,0.28) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(255,255,255,0.28) 75%),
        #dbe7ff;
      background-size: 32px 32px;
      background-position: 0 0, 0 16px, 16px -16px, -16px 0;
    }

    #boardCanvas {
      display: block;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 12px 34px rgba(28, 39, 75, 0.18);
      touch-action: none;
      cursor: crosshair;
    }

    .canvas-hint {
      position: absolute;
      pointer-events: none;
      color: #98a2b3;
      font-size: clamp(20px, 4vw, 34px);
      font-weight: 900;
      opacity: 0.72;
      transition: opacity 180ms ease;
    }

    .canvas-hint.hidden { opacity: 0; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: max(22px, env(safe-area-inset-bottom));
      transform: translate(-50%, 20px);
      background: var(--ink);
      color: #fff;
      padding: 12px 18px;
      border-radius: 14px;
      font-family: "Trebuchet MS", Arial, sans-serif;
      font-weight: 800;
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
      z-index: 100;
      box-shadow: 0 12px 34px rgba(15,23,42,0.24);
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 700px) {
      #homeScreen { padding: 14px; }
      .home-card { border-radius: 26px; padding: 24px 18px 30px; }
      .home-actions { grid-template-columns: 1fr; }
      .big-button { min-height: 70px; }

      .topbar {
        min-height: auto;
        flex-wrap: wrap;
        gap: 8px;
        padding-left: 10px;
        padding-right: 10px;
      }

      .topbar .brand span:last-child { display: none; }
      .join-code-box { margin-left: 0; order: 3; flex: 1 1 100%; justify-content: center; }
      .people-count { margin-left: auto; }
      .copy-button { min-width: 74px; }
      .toolbar { justify-content: flex-start; }
      .tool-button { min-width: 48px; height: 46px; }
      .colour-button { width: 35px; height: 35px; }
    }

    @media (max-height: 620px) and (orientation: landscape) {
      .topbar { min-height: 56px; padding-top: 6px; padding-bottom: 6px; }
      .toolbar { padding-top: 6px; padding-bottom: 6px; }
      .tool-button { height: 42px; min-width: 46px; }
      .colour-button { width: 32px; height: 32px; }
    }
  </style>
</head>
<body>
  <main id="homeScreen" class="screen active">
    <section class="home-card" aria-labelledby="pageTitle">
      <a class="brand" href="/" aria-label="Bright Arcade home">
        <span class="brand-mark" aria-hidden="true">★</span>
        <span>Bright Arcade</span>
      </a>

      <div class="board-icon" aria-hidden="true"></div>
      <h1 id="pageTitle">Whiteboard</h1>
      <p class="tagline">Create a whiteboard, share the four-character code and draw together in real time.</p>

      <div class="home-actions">
        <button id="createButton" class="big-button primary-button" type="button" disabled>Create Whiteboard</button>
        <button id="openJoinButton" class="big-button secondary-button" type="button" disabled>Join Whiteboard</button>
      </div>

      <div id="connectionMessage" class="connection-message" role="status" aria-live="polite">Connecting…</div>
    </section>
  </main>

  <main id="boardScreen" class="screen" aria-label="Collaborative whiteboard">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Bright Arcade home">
        <span class="brand-mark" aria-hidden="true">★</span>
        <span>Bright Arcade</span>
      </a>

      <div class="people-count" title="People connected">
        <span class="online-dot" aria-hidden="true"></span>
        <span id="peopleCount">1 connected</span>
      </div>

      <div class="join-code-box" aria-label="Join code">
        <div>
          <div class="join-code-label">JOIN CODE</div>
          <div id="joinCodeValue" class="join-code-value">---</div>
        </div>
        <button id="copyCodeButton" class="copy-button" type="button">Copy</button>
      </div>

      <button id="leaveButton" class="leave-button" type="button">Leave</button>
    </header>

    <div class="board-main">
      <nav class="toolbar" aria-label="Whiteboard tools">
        <button id="penButton" class="tool-button active" type="button" aria-label="Pen" title="Pen">✏️</button>
        <button id="eraserButton" class="tool-button" type="button" aria-label="Eraser" title="Eraser">⬜</button>

        <span class="divider" aria-hidden="true"></span>

        <button class="colour-button active" type="button" data-colour="#111827" aria-label="Black" title="Black" style="background:#111827"></button>
        <button class="colour-button" type="button" data-colour="#2563EB" aria-label="Blue" title="Blue" style="background:#2563EB"></button>
        <button class="colour-button" type="button" data-colour="#DC2626" aria-label="Red" title="Red" style="background:#DC2626"></button>
        <button class="colour-button" type="button" data-colour="#16A34A" aria-label="Green" title="Green" style="background:#16A34A"></button>
        <button class="colour-button" type="button" data-colour="#7C3AED" aria-label="Purple" title="Purple" style="background:#7C3AED"></button>

        <span class="divider" aria-hidden="true"></span>

        <button id="undoButton" class="tool-button" type="button" aria-label="Undo my last line" title="Undo my last line" disabled>↶</button>
        <button id="clearButton" class="tool-button danger" type="button" aria-label="Clear the whole board" title="Clear the whole board" hidden>🗑️</button>
      </nav>

      <section id="canvasArea" class="canvas-area" aria-label="Drawing area">
        <canvas id="boardCanvas" width="1600" height="900"></canvas>
        <div id="canvasHint" class="canvas-hint">Draw here!</div>
      </section>
    </div>
  </main>

  <div id="joinModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="joinTitle">
    <form id="joinForm" class="modal">
      <h2 id="joinTitle">Join a Whiteboard</h2>
      <p>Type the four-character code.</p>
      <input id="codeInput" class="code-input" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="4" aria-label="Four-character join code">
      <div id="joinError" class="modal-error" role="alert"></div>
      <div class="modal-actions">
        <button id="cancelJoinButton" class="modal-button cancel" type="button">Cancel</button>
        <button id="joinButton" class="modal-button join" type="submit">Join</button>
      </div>
    </form>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
    import {
      getDatabase,
      ref,
      get,
      set,
      remove,
      push,
      onValue,
      onChildAdded,
      onChildRemoved,
      onDisconnect,
      runTransaction
    } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

    /* Bright Arcade Firebase configuration */
    const firebaseConfig = {
      apiKey: "AIzaSyCKvQ3Fu8eenjBuTyx6vduNps_7DQYzHrk",
      authDomain: "bright-arcade.firebaseapp.com",
      databaseURL: "https://bright-arcade-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "bright-arcade",
      storageBucket: "bright-arcade.firebasestorage.app",
      messagingSenderId: "364676259613",
      appId: "1:364676259613:web:4d3b6729305eba65208bf4"
    };

    const BOARD_LIFETIME_MS = 4 * 60 * 60 * 1000;
    const CODE_CHARACTERS = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
    const CANVAS_WIDTH = 1600;
    const CANVAS_HEIGHT = 900;
    const SEND_INTERVAL_MS = 55;

    const allowedCodePattern = /^[A-HJ-KM-NP-Z2-9]{4}$/;

    const homeScreen = document.getElementById("homeScreen");
    const boardScreen = document.getElementById("boardScreen");
    const createButton = document.getElementById("createButton");
    const openJoinButton = document.getElementById("openJoinButton");
    const connectionMessage = document.getElementById("connectionMessage");

    const joinModal = document.getElementById("joinModal");
    const joinForm = document.getElementById("joinForm");
    const codeInput = document.getElementById("codeInput");
    const joinError = document.getElementById("joinError");
    const joinButton = document.getElementById("joinButton");
    const cancelJoinButton = document.getElementById("cancelJoinButton");

    const joinCodeValue = document.getElementById("joinCodeValue");
    const copyCodeButton = document.getElementById("copyCodeButton");
    const leaveButton = document.getElementById("leaveButton");
    const peopleCount = document.getElementById("peopleCount");

    const penButton = document.getElementById("penButton");
    const eraserButton = document.getElementById("eraserButton");
    const undoButton = document.getElementById("undoButton");
    const clearButton = document.getElementById("clearButton");
    const colourButtons = [...document.querySelectorAll(".colour-button")];

    const canvasArea = document.getElementById("canvasArea");
    const canvas = document.getElementById("boardCanvas");
    const ctx = canvas.getContext("2d", { alpha: false });
    const canvasHint = document.getElementById("canvasHint");
    const toast = document.getElementById("toast");

    let app = null;
    let auth = null;
    let db = null;
    let currentUser = null;
    let firebaseReady = false;

    let currentBoardCode = null;
    let currentBoardOwnerUid = null;
    let currentBoardExpiresAt = 0;
    let segmentsRef = null;
    let presenceConnectionRef = null;
    let disconnectOperation = null;
    let expiryTimer = null;
    let listenerUnsubscribers = [];

    let selectedTool = "pen";
    let selectedColour = "#111827";
    let drawing = false;
    let currentPointerId = null;
    let currentStroke = null;
    let lastSendAt = 0;

    const segmentStore = new Map();
    const locallyDrawnKeys = new Set();
    const ownStrokeOrder = [];
    const ownStrokeKeys = new Map();
    let redrawQueued = false;
    let toastTimer = null;

    function firebaseConfigHasBeenAdded() {
      return Object.values(firebaseConfig).every((value) =>
        typeof value === "string" && value.length > 3 && !value.includes("PASTE_")
      );
    }

    function setConnectionMessage(message, type = "") {
      connectionMessage.textContent = message;
      connectionMessage.className = `connection-message ${type}`.trim();
    }

    function setHomeButtonsEnabled(enabled) {
      createButton.disabled = !enabled;
      openJoinButton.disabled = !enabled;
    }

    function showToast(message) {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add("show");
      toastTimer = setTimeout(() => toast.classList.remove("show"), 1800);
    }

    function showScreen(screen) {
      homeScreen.classList.toggle("active", screen === "home");
      boardScreen.classList.toggle("active", screen === "board");
    }

    async function initialiseFirebase() {
      if (!firebaseConfigHasBeenAdded()) {
        setConnectionMessage("Firebase has not been connected yet. Add your Firebase config to this HTML file.", "error");
        return;
      }

      try {
        app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getDatabase(app);

        const credential = auth.currentUser
          ? { user: auth.currentUser }
          : await signInAnonymously(auth);

        currentUser = credential.user;
        firebaseReady = true;
        setHomeButtonsEnabled(true);
        setConnectionMessage("Ready to create or join a whiteboard.", "ready");
      } catch (error) {
        console.error("Firebase could not start:", error);
        setConnectionMessage(friendlyFirebaseError(error), "error");
      }
    }

    function friendlyFirebaseError(error) {
      const code = error?.code || "";
      if (code.includes("operation-not-allowed")) {
        return "Anonymous sign-in is not enabled in Firebase yet.";
      }
      if (code.includes("unauthorized-domain")) {
        return "This website domain has not been added to Firebase's authorised domains.";
      }
      if (code.includes("permission-denied")) {
        return "Firebase blocked the connection. Check the Realtime Database rules.";
      }
      return "Could not connect to Firebase. Check the setup and try again.";
    }

    function randomCode() {
      const values = new Uint32Array(4);
      crypto.getRandomValues(values);
      return [...values].map((value) => CODE_CHARACTERS[value % CODE_CHARACTERS.length]).join("");
    }

    async function createBoard() {
      if (!firebaseReady || !currentUser) return;

      createButton.disabled = true;
      openJoinButton.disabled = true;
      setConnectionMessage("Creating your whiteboard…");

      try {
        for (let attempt = 0; attempt < 30; attempt += 1) {
          const code = randomCode();
          const codeReference = ref(db, `codes/${code}`);
          const boardReference = ref(db, `boards/${code}`);
          const now = Date.now();
          const boardData = {
            ownerUid: currentUser.uid,
            createdAt: now,
            expiresAt: now + BOARD_LIFETIME_MS
          };

          const result = await runTransaction(
            codeReference,
            (existingCode) => {
              if (!existingCode || !existingCode.expiresAt || existingCode.expiresAt <= now) {
                return { ownerUid: currentUser.uid, expiresAt: boardData.expiresAt };
              }
              return;
            },
            { applyLocally: false }
          );

          if (result.committed) {
            try {
              await set(boardReference, boardData);
            } catch (error) {
              try { await remove(codeReference); } catch (_) { /* The reservation will expire automatically. */ }
              throw error;
            }
            await enterBoard(code, boardData);
            setConnectionMessage("Ready to create or join a whiteboard.", "ready");
            return;
          }
        }

        throw new Error("No available whiteboard code could be generated.");
      } catch (error) {
        console.error("Board creation failed:", error);
        setConnectionMessage(friendlyFirebaseError(error), "error");
      } finally {
        if (!currentBoardCode) setHomeButtonsEnabled(firebaseReady);
      }
    }

    function openJoinModal() {
      if (!firebaseReady) return;
      joinError.textContent = "";
      codeInput.value = "";
      joinModal.classList.add("open");
      setTimeout(() => codeInput.focus(), 50);
    }

    function closeJoinModal() {
      joinModal.classList.remove("open");
      joinError.textContent = "";
      joinButton.disabled = false;
    }

    async function joinBoard(code) {
      if (!firebaseReady || !currentUser) return;

      const cleanCode = code.trim().toUpperCase();
      if (!allowedCodePattern.test(cleanCode)) {
        joinError.textContent = "Enter a valid four-character code.";
        return;
      }

      joinButton.disabled = true;
      joinError.textContent = "Finding board…";

      try {
        const boardSnapshot = await get(ref(db, `boards/${cleanCode}`));
        const boardData = boardSnapshot.val();

        if (!boardSnapshot.exists() || !boardData?.expiresAt || boardData.expiresAt <= Date.now()) {
          joinError.textContent = "That whiteboard could not be found. Check the code.";
          joinButton.disabled = false;
          return;
        }

        closeJoinModal();
        await enterBoard(cleanCode, boardData);
      } catch (error) {
        console.error("Joining board failed:", error);
        joinError.textContent = error?.code?.includes("permission-denied")
          ? "That whiteboard could not be found. Check the code."
          : friendlyFirebaseError(error);
        joinButton.disabled = false;
      }
    }

    async function enterBoard(code, boardData) {
      await leaveBoard(false);

      currentBoardCode = code;
      currentBoardOwnerUid = boardData.ownerUid;
      currentBoardExpiresAt = boardData.expiresAt;
      segmentsRef = ref(db, `boards/${code}/segments`);

      segmentStore.clear();
      locallyDrawnKeys.clear();
      ownStrokeOrder.length = 0;
      ownStrokeKeys.clear();
      updateUndoButton();
      clearCanvas();

      joinCodeValue.textContent = code;
      clearButton.hidden = currentBoardOwnerUid !== currentUser.uid;
      showScreen("board");
      requestAnimationFrame(fitCanvasToArea);

      const presenceListRef = ref(db, `boards/${code}/presence`);
      presenceConnectionRef = push(presenceListRef);
      disconnectOperation = onDisconnect(presenceConnectionRef);

      // Register the automatic removal before showing this connection as active.
      await disconnectOperation.remove();
      await set(presenceConnectionRef, { uid: currentUser.uid });

      listenerUnsubscribers.push(
        onChildAdded(segmentsRef, (snapshot) => {
          const key = snapshot.key;
          const segment = snapshot.val();
          if (!key || !segment) return;

          segmentStore.set(key, segment);
          canvasHint.classList.toggle("hidden", segmentStore.size > 0);

          if (locallyDrawnKeys.has(key)) {
            locallyDrawnKeys.delete(key);
            return;
          }
          drawStoredSegment(segment);
        })
      );

      listenerUnsubscribers.push(
        onChildRemoved(segmentsRef, (snapshot) => {
          if (snapshot.key) segmentStore.delete(snapshot.key);
          canvasHint.classList.toggle("hidden", segmentStore.size > 0);
          queueFullRedraw();
        })
      );

      listenerUnsubscribers.push(
        onValue(presenceListRef, (snapshot) => {
          const count = snapshot.size ?? snapshot.numChildren();
          peopleCount.textContent = `${count} connected`;
        })
      );

      listenerUnsubscribers.push(
        onValue(ref(db, `boards/${code}/expiresAt`), (snapshot) => {
          const value = snapshot.val();
          if (!value || value <= Date.now()) {
            expireCurrentBoard();
          }
        })
      );

      scheduleExpiryTimer();
      showToast(`Board ${code} is ready`);
    }

    function scheduleExpiryTimer() {
      clearTimeout(expiryTimer);
      const delay = Math.max(0, currentBoardExpiresAt - Date.now());
      expiryTimer = setTimeout(expireCurrentBoard, delay + 250);
    }

    function expireCurrentBoard() {
      if (!currentBoardCode) return;
      alert("This board has expired. Create a new board to keep drawing.");
      leaveBoard(true);
    }

    async function leaveBoard(showHome = true) {
      drawing = false;
      currentPointerId = null;
      currentStroke = null;

      clearTimeout(expiryTimer);
      expiryTimer = null;

      listenerUnsubscribers.forEach((unsubscribe) => {
        try { unsubscribe(); } catch (_) { /* No action needed. */ }
      });
      listenerUnsubscribers = [];

      if (presenceConnectionRef) {
        try { await remove(presenceConnectionRef); } catch (_) { /* onDisconnect is the backup. */ }
      }
      if (disconnectOperation) {
        try { await disconnectOperation.cancel(); } catch (_) { /* No action needed. */ }
      }

      presenceConnectionRef = null;
      disconnectOperation = null;
      currentBoardCode = null;
      currentBoardOwnerUid = null;
      currentBoardExpiresAt = 0;
      segmentsRef = null;

      segmentStore.clear();
      locallyDrawnKeys.clear();
      ownStrokeOrder.length = 0;
      ownStrokeKeys.clear();
      updateUndoButton();
      clearCanvas();

      if (showHome) {
        showScreen("home");
        setHomeButtonsEnabled(firebaseReady);
      }
    }

    function fitCanvasToArea() {
      const bounds = canvasArea.getBoundingClientRect();
      const availableWidth = Math.max(100, bounds.width - 20);
      const availableHeight = Math.max(100, bounds.height - 20);
      const ratio = CANVAS_WIDTH / CANVAS_HEIGHT;

      let width = availableWidth;
      let height = width / ratio;

      if (height > availableHeight) {
        height = availableHeight;
        width = height * ratio;
      }

      canvas.style.width = `${Math.floor(width)}px`;
      canvas.style.height = `${Math.floor(height)}px`;
    }

    function clearCanvas() {
      ctx.save();
      ctx.fillStyle = "#FFFFFF";
      ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
      ctx.restore();
      canvasHint.classList.remove("hidden");
    }

    function queueFullRedraw() {
      if (redrawQueued) return;
      redrawQueued = true;
      requestAnimationFrame(() => {
        redrawQueued = false;
        redrawAllSegments();
      });
    }

    function redrawAllSegments() {
      clearCanvas();
      [...segmentStore.entries()]
        .sort(([firstKey], [secondKey]) => firstKey.localeCompare(secondKey))
        .forEach(([, segment]) => drawStoredSegment(segment));
      canvasHint.classList.toggle("hidden", segmentStore.size > 0);
    }

    function pointFromPointerEvent(event) {
      const bounds = canvas.getBoundingClientRect();
      return {
        x: Math.max(0, Math.min(CANVAS_WIDTH, (event.clientX - bounds.left) * (CANVAS_WIDTH / bounds.width))),
        y: Math.max(0, Math.min(CANVAS_HEIGHT, (event.clientY - bounds.top) * (CANVAS_HEIGHT / bounds.height)))
      };
    }

    function distanceBetween(first, second) {
      return Math.hypot(second.x - first.x, second.y - first.y);
    }

    function drawPath(points, tool, colour, size) {
      if (!points.length) return;

      ctx.save();
      ctx.globalCompositeOperation = "source-over";
      ctx.strokeStyle = tool === "eraser" ? "#FFFFFF" : colour;
      ctx.fillStyle = ctx.strokeStyle;
      ctx.lineWidth = size;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      if (points.length === 1) {
        ctx.beginPath();
        ctx.arc(points[0].x, points[0].y, size / 2, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let index = 1; index < points.length; index += 1) {
          ctx.lineTo(points[index].x, points[index].y);
        }
        ctx.stroke();
      }
      ctx.restore();
    }

    function encodePoints(points) {
      return points
        .map((point) => `${Math.round(point.x * 10) / 10},${Math.round(point.y * 10) / 10}`)
        .join("|");
    }

    function decodePoints(encodedPoints) {
      if (typeof encodedPoints !== "string" || !encodedPoints) return [];
      return encodedPoints.split("|").map((pair) => {
        const [x, y] = pair.split(",").map(Number);
        return { x, y };
      }).filter((point) => Number.isFinite(point.x) && Number.isFinite(point.y));
    }

    function drawStoredSegment(segment) {
      const points = decodePoints(segment.points);
      drawPath(points, segment.tool, segment.colour, segment.size);
    }

    function beginStroke(event) {
      if (!currentBoardCode || !segmentsRef || drawing) return;
      if (event.pointerType === "mouse" && event.button !== 0) return;

      drawing = true;
      currentPointerId = event.pointerId;
      canvas.setPointerCapture(event.pointerId);

      const point = pointFromPointerEvent(event);
      currentStroke = {
        id: `${currentUser.uid.slice(0, 10)}_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
        tool: selectedTool,
        colour: selectedTool === "eraser" ? "#FFFFFF" : selectedColour,
        size: selectedTool === "eraser" ? 44 : 9,
        pendingPoints: [point],
        lastPoint: point,
        sentAny: false
      };
      lastSendAt = performance.now();
      event.preventDefault();
    }

    function continueStroke(event) {
      if (!drawing || event.pointerId !== currentPointerId || !currentStroke) return;

      const point = pointFromPointerEvent(event);
      if (distanceBetween(currentStroke.lastPoint, point) < 0.8) return;

      drawPath([currentStroke.lastPoint, point], currentStroke.tool, currentStroke.colour, currentStroke.size);
      currentStroke.pendingPoints.push(point);
      currentStroke.lastPoint = point;
      canvasHint.classList.add("hidden");

      if (performance.now() - lastSendAt >= SEND_INTERVAL_MS) flushCurrentStroke(false);
      event.preventDefault();
    }

    function endStroke(event) {
      if (!drawing || event.pointerId !== currentPointerId || !currentStroke) return;

      const finalPoint = pointFromPointerEvent(event);
      if (distanceBetween(currentStroke.lastPoint, finalPoint) >= 0.8) {
        drawPath([currentStroke.lastPoint, finalPoint], currentStroke.tool, currentStroke.colour, currentStroke.size);
        currentStroke.pendingPoints.push(finalPoint);
        currentStroke.lastPoint = finalPoint;
      }

      flushCurrentStroke(true);

      drawing = false;
      currentPointerId = null;
      currentStroke = null;
      try { canvas.releasePointerCapture(event.pointerId); } catch (_) { /* Already released. */ }
      event.preventDefault();
    }

    function cancelStroke(event) {
      if (!drawing || event.pointerId !== currentPointerId) return;
      flushCurrentStroke(true);
      drawing = false;
      currentPointerId = null;
      currentStroke = null;
    }

    function flushCurrentStroke(finalFlush) {
      if (!currentStroke || !segmentsRef) return;

      const points = [...currentStroke.pendingPoints];
      const shouldSendSinglePoint = finalFlush && !currentStroke.sentAny && points.length === 1;
      if (points.length < 2 && !shouldSendSinglePoint) return;

      const segmentReference = push(segmentsRef);
      const key = segmentReference.key;
      if (!key) return;

      const segment = {
        uid: currentUser.uid,
        strokeId: currentStroke.id,
        tool: currentStroke.tool,
        colour: currentStroke.colour,
        size: currentStroke.size,
        points: encodePoints(points),
        createdAt: Date.now()
      };

      segmentStore.set(key, segment);
      locallyDrawnKeys.add(key);

      if (!ownStrokeKeys.has(currentStroke.id)) {
        ownStrokeKeys.set(currentStroke.id, []);
        ownStrokeOrder.push(currentStroke.id);
      }
      ownStrokeKeys.get(currentStroke.id).push(key);
      updateUndoButton();

      set(segmentReference, segment).catch((error) => {
        console.error("A drawing segment could not be saved:", error);
        locallyDrawnKeys.delete(key);
        segmentStore.delete(key);
        queueFullRedraw();
        showToast("The board connection was interrupted");
      });

      currentStroke.sentAny = true;
      currentStroke.pendingPoints = [currentStroke.lastPoint];
      lastSendAt = performance.now();
    }

    function selectTool(tool) {
      selectedTool = tool;
      penButton.classList.toggle("active", tool === "pen");
      eraserButton.classList.toggle("active", tool === "eraser");
      canvas.style.cursor = tool === "eraser" ? "cell" : "crosshair";
    }

    function selectColour(colour) {
      selectedColour = colour;
      colourButtons.forEach((button) => button.classList.toggle("active", button.dataset.colour === colour));
      selectTool("pen");
    }

    function updateUndoButton() {
      undoButton.disabled = ownStrokeOrder.length === 0;
    }

    async function undoLastStroke() {
      if (!segmentsRef || ownStrokeOrder.length === 0) return;

      const strokeId = ownStrokeOrder.pop();
      const keys = ownStrokeKeys.get(strokeId) || [];
      ownStrokeKeys.delete(strokeId);
      updateUndoButton();

      try {
        await Promise.all(keys.map((key) => remove(ref(db, `boards/${currentBoardCode}/segments/${key}`))));
      } catch (error) {
        console.error("Undo failed:", error);
        showToast("Undo could not be completed");
      }
    }

    async function clearWholeBoard() {
      if (!segmentsRef || currentUser.uid !== currentBoardOwnerUid) return;
      const confirmed = confirm("Clear everything on this board?");
      if (!confirmed) return;

      try {
        segmentStore.clear();
        ownStrokeOrder.length = 0;
        ownStrokeKeys.clear();
        updateUndoButton();
        clearCanvas();
        await remove(segmentsRef);
        showToast("Board cleared");
      } catch (error) {
        console.error("Clear board failed:", error);
        showToast("The board could not be cleared");
      }
    }

    async function copyJoinCode() {
      if (!currentBoardCode) return;
      try {
        await navigator.clipboard.writeText(currentBoardCode);
        showToast("Join code copied");
      } catch (_) {
        showToast(`Join code: ${currentBoardCode}`);
      }
    }

    createButton.addEventListener("click", createBoard);
    openJoinButton.addEventListener("click", openJoinModal);
    cancelJoinButton.addEventListener("click", closeJoinModal);
    leaveButton.addEventListener("click", () => leaveBoard(true));
    copyCodeButton.addEventListener("click", copyJoinCode);

    joinForm.addEventListener("submit", (event) => {
      event.preventDefault();
      joinBoard(codeInput.value);
    });

    codeInput.addEventListener("input", () => {
      const cleaned = codeInput.value.toUpperCase().replace(/[^A-HJ-KM-NP-Z2-9]/g, "").slice(0, 4);
      codeInput.value = cleaned;
      joinError.textContent = "";
    });

    joinModal.addEventListener("click", (event) => {
      if (event.target === joinModal) closeJoinModal();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && joinModal.classList.contains("open")) closeJoinModal();
    });

    penButton.addEventListener("click", () => selectTool("pen"));
    eraserButton.addEventListener("click", () => selectTool("eraser"));
    colourButtons.forEach((button) => button.addEventListener("click", () => selectColour(button.dataset.colour)));
    undoButton.addEventListener("click", undoLastStroke);
    clearButton.addEventListener("click", clearWholeBoard);

    canvas.addEventListener("pointerdown", beginStroke);
    canvas.addEventListener("pointermove", continueStroke);
    canvas.addEventListener("pointerup", endStroke);
    canvas.addEventListener("pointercancel", cancelStroke);
    canvas.addEventListener("contextmenu", (event) => event.preventDefault());

    new ResizeObserver(fitCanvasToArea).observe(canvasArea);
    window.addEventListener("resize", fitCanvasToArea);

    clearCanvas();
    initialiseFirebase();
  </script>
</body>
</html>
