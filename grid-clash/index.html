<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grid Clash | Bright Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Baloo+2:wght@800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#27324a; --muted:#6e7b90; --panel:rgba(255,255,255,.95);
  --soft:#edf3fb; --shadow:0 20px 50px rgba(35,49,90,.18);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Fredoka",Arial,sans-serif;color:var(--ink)}
body{
  min-height:100vh;
  background:
    radial-gradient(circle at 12% 12%,rgba(255,255,255,.58),transparent 24%),
    radial-gradient(circle at 88% 16%,rgba(255,255,255,.36),transparent 22%),
    linear-gradient(135deg,#78d7ff 0%,#c8b7ff 51%,#ffa9cf 100%);
}
button{font:inherit}
.app{min-height:100vh}
.sidebar{
  position:fixed;left:20px;top:50%;transform:translateY(-50%);width:170px;
  display:flex;flex-direction:column;gap:12px;z-index:20
}
.brand{background:transparent!important;border:0!important;box-shadow:none!important;padding:0!important;text-decoration:none}
.sidebar-logo{
  width:170px;padding:16px 12px 18px;background:linear-gradient(180deg,#ffffff 0%,#fff7d6 100%);
  border-radius:28px;box-shadow:0 7px 16px rgba(0,0,0,.16),0 7px 0 rgba(31,41,55,.10);
  transform:rotate(-1deg);overflow:hidden
}
.sidebar-bright,.sidebar-arcade{display:flex;justify-content:center;align-items:center;white-space:nowrap}
.sidebar-bright span{
  display:inline-block;font-family:"Baloo 2","Fredoka",Arial,sans-serif;font-weight:800;
  font-size:1.72rem;line-height:.9;color:var(--c);text-shadow:2px 2px 0 rgba(6,25,70,.16)
}
.sidebar-arcade{
  margin-top:7px;font-family:"Baloo 2","Fredoka",Arial,sans-serif;font-weight:800;
  font-size:2rem;line-height:.82;color:#061946;text-shadow:2px 2px 0 rgba(6,25,70,.16)
}
.side-btn{
  display:block;background:white;color:#1f2937;text-decoration:none;font-weight:800;text-align:center;
  padding:12px 16px;border-radius:999px;border:3px solid #bfdbfe;box-shadow:0 6px 14px rgba(0,0,0,.15)
}
.side-btn:hover{background:#fef3c7}
main{width:min(1120px,100%);margin:0 auto;margin-left:220px;padding:24px 18px 46px}
.menu-view{width:min(980px,100%);margin:0 auto}

.screen{
  width:min(980px,100%);background:var(--panel);border:3px solid rgba(255,255,255,.8);
  border-radius:34px;padding:28px;box-shadow:var(--shadow);backdrop-filter:blur(8px)
}
.hidden{display:none!important}
.game-header{text-align:center;margin-bottom:24px}
.grid-title-card{
  position:relative;width:min(920px,96%);min-height:170px;margin:0 auto;border:8px solid #061946;
  border-radius:50px;background:radial-gradient(circle at 18% 20%,rgba(255,255,255,.23) 0 13%,transparent 14%),
  radial-gradient(circle at 82% 78%,rgba(6,25,70,.14) 0 18%,transparent 19%),
  linear-gradient(110deg,#06b6d4 0%,#2563eb 45%,#7c3aed 100%);
  box-shadow:0 16px 0 rgba(6,25,70,.96),0 28px 34px rgba(6,25,70,.26),
  inset 0 9px 0 rgba(255,255,255,.30),inset 0 -11px 0 rgba(6,25,70,.12);
  overflow:hidden;transform:rotate(-.6deg)
}
.grid-title-card::before{content:"";position:absolute;inset:0;background:
  radial-gradient(circle at 8% 74%,rgba(255,255,255,.40) 0 22px,transparent 23px),
  radial-gradient(circle at 20% 30%,rgba(255,255,255,.35) 0 14px,transparent 15px),
  radial-gradient(circle at 86% 25%,rgba(255,255,255,.36) 0 24px,transparent 25px),
  radial-gradient(circle at 76% 72%,rgba(255,255,255,.28) 0 16px,transparent 17px)}
.grid-title-text{
  position:relative;z-index:5;min-height:170px;display:flex;align-items:center;justify-content:center;
  font-family:"Baloo 2","Fredoka",Arial,sans-serif;font-size:clamp(3.6rem,8vw,7rem);font-weight:800;
  line-height:.83;letter-spacing:-4px;color:#fef08a;-webkit-text-stroke:5px #000;paint-order:stroke fill;
  text-shadow:0 7px 0 rgba(0,0,0,.28),0 13px 13px rgba(0,0,0,.20);transform:rotate(.6deg)
}
.title-piece{position:absolute;z-index:6;width:68px;height:68px;border:5px solid #061946;border-radius:18px;
  box-shadow:7px 8px 0 rgba(6,25,70,.24),inset -7px -9px 0 rgba(6,25,70,.12),inset 7px 6px 0 rgba(255,255,255,.38);animation:pieceBob 1.4s ease-in-out infinite}
.title-piece.p1{left:34px;top:28px;background:linear-gradient(145deg,#bfdbfe,#38bdf8);transform:rotate(-9deg)}
.title-piece.p2{left:105px;bottom:25px;background:linear-gradient(145deg,#fef08a,#facc15);transform:rotate(7deg);animation-delay:-.3s}
.title-piece.p3{right:105px;top:24px;background:linear-gradient(145deg,#fecdd3,#fb7185);transform:rotate(9deg);animation-delay:-.55s}
.title-piece.p4{right:30px;bottom:25px;background:linear-gradient(145deg,#dcfce7,#22c55e);transform:rotate(-7deg);animation-delay:-.8s}
@keyframes pieceBob{0%,100%{translate:0 0}50%{translate:0 -9px}}
.subtitle{text-align:center;margin:16px auto 24px;font-size:18px;font-weight:800;color:var(--muted)}
.setup-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card{
  background:linear-gradient(180deg,#fff,#f7f9ff);border:2px solid #e5eaf3;
  border-radius:24px;padding:21px;box-shadow:0 10px 24px rgba(50,70,115,.08)
}
.card h2{margin:0 0 14px;font-size:21px;font-weight:1000}
.choice-row{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.choice-row.three{grid-template-columns:repeat(3,1fr)}
.choice{
  border:3px solid transparent;border-radius:18px;min-height:68px;padding:10px;
  background:#edf2fb;color:var(--ink);font-weight:1000;font-size:18px;cursor:pointer;transition:.16s
}
.choice:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(50,70,115,.12)}
.choice.selected{
  border-color:#5b6ee1;background:linear-gradient(180deg,#f1f3ff,#dde3ff);
  box-shadow:0 0 0 4px rgba(91,110,225,.12)
}
.player-card{position:relative}
.player-label{font-size:20px;font-weight:1000;margin-bottom:12px}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.swatch{
  aspect-ratio:1.15;border:4px solid #fff;border-radius:17px;box-shadow:0 5px 14px rgba(0,0,0,.14);
  cursor:pointer;transition:.16s;position:relative
}
.swatch:hover:not(:disabled){transform:scale(1.05)}
.swatch.selected::after{
  content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#fff;
  font-size:30px;font-weight:1000;text-shadow:0 2px 6px rgba(0,0,0,.45)
}
.swatch:disabled{opacity:.18;cursor:not-allowed;filter:grayscale(.6)}
.start-wrap{text-align:center;margin-top:22px}
.primary{
  border:0;border-radius:20px;padding:17px 34px;min-width:220px;
  background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-weight:1000;
  font-size:21px;cursor:pointer;box-shadow:0 12px 25px rgba(68,68,190,.27);transition:.16s
}
.primary:hover:not(:disabled){transform:translateY(-2px)}
.primary:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.game-top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.turn-pill{
  border-radius:18px;padding:13px 20px;font-size:21px;font-weight:1000;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.35),0 8px 18px rgba(44,62,100,.12)
}
.small-btn{
  border:0;border-radius:15px;padding:11px 17px;background:#edf2fb;color:#33455d;font-weight:900;cursor:pointer
}
.board-shell{width:min(76vh,760px,100%);margin:0 auto}
.drop-row{
  --size:7;display:grid;grid-template-columns:repeat(var(--size),1fr);gap:8px;margin:0 12px 8px
}
.drop-btn{
  border:0;border-radius:13px;min-height:42px;background:#edf2fb;color:#33455d;
  font-size:23px;font-weight:1000;cursor:pointer;transition:.14s;box-shadow:0 4px 10px rgba(50,70,115,.1)
}
.drop-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 7px 14px rgba(50,70,115,.15)}
.drop-btn:disabled{opacity:.22;cursor:not-allowed}
.board{
  --size:7;display:grid;grid-template-columns:repeat(var(--size),1fr);gap:8px;width:100%;aspect-ratio:1;
  background:linear-gradient(180deg,#dce6f4,#c8d5e8);border-radius:24px;padding:12px;
  box-shadow:inset 0 3px 8px rgba(65,85,120,.17),0 12px 25px rgba(45,60,95,.15);
  position:relative;overflow:hidden
}
.cell{
  border-radius:14px;background:linear-gradient(145deg,#fff,#edf1f7);
  box-shadow:inset 0 0 0 2px rgba(135,150,180,.22),0 4px 7px rgba(45,60,95,.1);
  position:relative;overflow:hidden
}
.tile{
  position:absolute;inset:0;border-radius:inherit;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.28),inset 0 -2px 0 rgba(0,0,0,.08)
}
.tile.drop{
  animation:dropTile var(--drop-duration,.38s) cubic-bezier(.25,.8,.35,1.05) forwards;
  transform:translateY(var(--start-y,-500px))
}
@keyframes dropTile{
  0%{transform:translateY(var(--start-y,-500px))}
  82%{transform:translateY(7%)}
  100%{transform:translateY(0)}
}
.cell.winner{z-index:2;animation:winPulse .72s ease-in-out infinite alternate}
@keyframes winPulse{
  from{transform:scale(.96);filter:brightness(1)}
  to{transform:scale(1.08);filter:brightness(1.2);box-shadow:0 0 0 5px #fff,0 0 28px rgba(255,255,255,.95)}
}
.message{
  text-align:center;margin-top:20px;padding:20px;border-radius:23px;
  background:linear-gradient(180deg,#fff9df,#fff0b6);border:2px solid #f2d76d
}
.message h2{margin:0 0 14px;font-size:32px}
.message-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.confetti{
  position:fixed;top:-24px;width:10px;height:16px;border-radius:3px;z-index:999;
  pointer-events:none;animation:fall 2.5s linear forwards
}
@keyframes fall{to{transform:translateY(110vh) rotate(760deg)}}
@media(max-width:900px){
  .sidebar{position:static;transform:none;width:auto;flex-direction:row;justify-content:center;margin:12px auto}
  .sidebar-logo{display:none}.side-btn{min-width:110px}
  main{margin-left:auto;padding:10px 12px 34px}.screen{padding:18px 14px;border-radius:25px}
  .setup-grid{grid-template-columns:1fr}
  .board{gap:5px;padding:8px;border-radius:18px}
  .drop-row{gap:5px;margin:0 8px 6px}.drop-btn{min-height:38px;font-size:20px}.cell{border-radius:9px}
}
@media(max-width:650px){
  .grid-title-card{min-height:142px;border-width:6px;border-radius:38px}
  .grid-title-text{min-height:142px;font-size:clamp(3rem,16vw,4.8rem);-webkit-text-stroke:4px}
  .title-piece{width:48px;height:48px;border-width:4px;border-radius:13px}
  .title-piece.p1{left:8px;top:18px}.title-piece.p2{left:40px;bottom:15px}
  .title-piece.p3{right:40px;top:16px}.title-piece.p4{right:8px;bottom:15px}
  .choice{font-size:16px;min-height:60px}.turn-pill{font-size:17px}
}
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar">
    <a class="brand" href="/" aria-label="Bright Arcade Home">
      <div class="sidebar-logo">
        <div class="sidebar-bright">
          <span style="--c:#ef174d">B</span><span style="--c:#f97316">R</span><span style="--c:#facc15">I</span><span style="--c:#49c600">G</span><span style="--c:#0875f5">H</span><span style="--c:#7030d8">T</span>
        </div>
        <div class="sidebar-arcade">ARCADE</div>
      </div>
    </a>
    <a class="side-btn" href="/">Home</a>
  </nav>

  <main>
    <div id="menuView" class="menu-view">
      <header class="game-header">
        <div class="grid-title-card">
          <div class="title-piece p1"></div><div class="title-piece p2"></div>
          <div class="grid-title-text">GRID CLASH</div>
          <div class="title-piece p3"></div><div class="title-piece p4"></div>
        </div>
        <p class="subtitle">Choose a column, drop your colour and connect four to win.</p>
      </header>
      <section id="menuScreen" class="screen">

      <div class="setup-grid">
        <div class="card">
          <h2>1. Choose game mode</h2>
          <div class="choice-row">
            <button class="choice" data-mode="computer">vs Computer</button>
            <button class="choice" data-mode="two">2 Players</button>
          </div>
        </div>

        <div class="card">
          <h2>2. Choose board size</h2>
          <div class="choice-row three">
            <button class="choice" data-size="6">6 × 6</button>
            <button class="choice" data-size="7">7 × 7</button>
            <button class="choice" data-size="8">8 × 8</button>
          </div>
        </div>

        <div class="card player-card">
          <div id="p1Label" class="player-label">Player 1 colour</div>
          <div id="p1Colours" class="swatches"></div>
        </div>

        <div class="card player-card">
          <div id="p2Label" class="player-label">Player 2 colour</div>
          <div id="p2Colours" class="swatches"></div>
        </div>
      </div>

      <div class="start-wrap">
        <button id="startBtn" class="primary" disabled>Start Game</button>
      </div>
      </section>
    </div>

    <section id="gameScreen" class="screen hidden">
      <div class="game-top">
        <div id="turnPill" class="turn-pill">Player 1's turn</div>
        <button id="menuBtn" class="small-btn">Main Menu</button>
      </div>

      <div class="board-shell">
        <div id="dropRow" class="drop-row" aria-label="Choose a column"></div>
        <div id="board" class="board" aria-label="Grid Clash board"></div>
      </div>

      <div id="message" class="message hidden">
        <h2 id="messageText"></h2>
        <div class="message-actions">
          <button id="againBtn" class="primary">Play Again</button>
          <button id="messageMenuBtn" class="small-btn">Main Menu</button>
        </div>
      </div>
    </section>
  </main>
</div>

<script>
const colours=[
  {name:"Blue",value:"#2f6df6"},
  {name:"Red",value:"#ef4444"},
  {name:"Green",value:"#22a55b"},
  {name:"Yellow",value:"#f2bd24"},
  {name:"Purple",value:"#8b5cf6"},
  {name:"Orange",value:"#f97316"},
  {name:"Pink",value:"#ec4899"},
  {name:"Brown",value:"#8b5a2b"}
];

let gameMode=null, boardSize=null, playerColours=[null,null];
let currentPlayer=0, boardState=[], gameOver=false, animating=false, computerThinking=false;

const menuScreen=document.getElementById("menuScreen");
const menuView=document.getElementById("menuView");
const gameScreen=document.getElementById("gameScreen");
const startBtn=document.getElementById("startBtn");
const boardEl=document.getElementById("board");
const dropRow=document.getElementById("dropRow");
const turnPill=document.getElementById("turnPill");
const message=document.getElementById("message");
const messageText=document.getElementById("messageText");
const p1Label=document.getElementById("p1Label");
const p2Label=document.getElementById("p2Label");

document.querySelectorAll("[data-mode]").forEach(btn=>{
  btn.onclick=()=>{
    gameMode=btn.dataset.mode;
    document.querySelectorAll("[data-mode]").forEach(b=>b.classList.toggle("selected",b===btn));
    p1Label.textContent=gameMode==="computer"?"Your colour":"Player 1 colour";
    p2Label.textContent=gameMode==="computer"?"Computer colour":"Player 2 colour";
    validateSetup();
  };
});
document.querySelectorAll("[data-size]").forEach(btn=>{
  btn.onclick=()=>{
    boardSize=Number(btn.dataset.size);
    document.querySelectorAll("[data-size]").forEach(b=>b.classList.toggle("selected",b===btn));
    validateSetup();
  };
});

function lighten(hex,a){
  const n=parseInt(hex.slice(1),16);
  return `rgb(${Math.min(255,(n>>16)+a)},${Math.min(255,((n>>8)&255)+a)},${Math.min(255,(n&255)+a)})`;
}
function darken(hex,a){
  const n=parseInt(hex.slice(1),16);
  return `rgb(${Math.max(0,(n>>16)-a)},${Math.max(0,((n>>8)&255)-a)},${Math.max(0,(n&255)-a)})`;
}
function gradient(hex){return `linear-gradient(145deg,${lighten(hex,30)} 0%,${hex} 52%,${darken(hex,28)} 100%)`}

function renderSwatches(){
  [0,1].forEach(player=>{
    const holder=document.getElementById(player===0?"p1Colours":"p2Colours");
    holder.innerHTML="";
    colours.forEach(c=>{
      const sw=document.createElement("button");
      sw.className="swatch";
      sw.title=c.name;
      sw.setAttribute("aria-label",c.name);
      sw.style.background=gradient(c.value);
      const unavailable=playerColours[1-player]?.name===c.name;
      sw.disabled=unavailable;
      if(playerColours[player]?.name===c.name) sw.classList.add("selected");
      sw.onclick=()=>{
        if(unavailable)return;
        playerColours[player]=c;
        renderSwatches();
        validateSetup();
      };
      holder.appendChild(sw);
    });
  });
}
function validateSetup(){startBtn.disabled=!(gameMode&&boardSize&&playerColours[0]&&playerColours[1])}
renderSwatches();

startBtn.onclick=startGame;
document.getElementById("againBtn").onclick=startGame;
document.getElementById("menuBtn").onclick=showMenu;
document.getElementById("messageMenuBtn").onclick=showMenu;

function startGame(){
  currentPlayer=0; gameOver=false; animating=false; computerThinking=false;
  boardState=Array.from({length:boardSize},()=>Array(boardSize).fill(null));
  boardEl.innerHTML=""; dropRow.innerHTML=""; message.classList.add("hidden");
  boardEl.style.setProperty("--size",boardSize);
  dropRow.style.setProperty("--size",boardSize);

  for(let c=0;c<boardSize;c++){
    const btn=document.createElement("button");
    btn.className="drop-btn"; btn.textContent="▼";
    btn.setAttribute("aria-label",`Drop in column ${c+1}`);
    btn.onclick=()=>dropInColumn(c,false);
    dropRow.appendChild(btn);
  }
  for(let r=0;r<boardSize;r++){
    for(let c=0;c<boardSize;c++){
      const cell=document.createElement("div");
      cell.className="cell";
      boardEl.appendChild(cell);
    }
  }
  menuView.classList.add("hidden");
  gameScreen.classList.remove("hidden");
  updateTurnDisplay();
}
function showMenu(){
  gameScreen.classList.add("hidden");
  menuView.classList.remove("hidden");
}
function displayName(p){
  if(gameMode==="computer") return p===0?"You":"Computer";
  return `Player ${p+1}`;
}
function updateTurnDisplay(){
  const c=playerColours[currentPlayer];
  turnPill.textContent=computerThinking?"Computer is thinking...":`${displayName(currentPlayer)} (${c.name})`;
  turnPill.style.background=gradient(c.value);
  turnPill.style.color=c.name==="Yellow"?"#4b3a08":"#fff";
  [...dropRow.children].forEach((btn,col)=>{
    const full=boardState[0]?.[col]!==null;
    const locked=gameMode==="computer"&&currentPlayer===1;
    btn.disabled=gameOver||animating||computerThinking||full||locked;
    btn.style.boxShadow=full?"":`0 0 0 3px ${lighten(c.value,38)}55,0 6px 14px rgba(40,55,90,.12)`;
  });
}
function getOpenRow(col){
  for(let r=boardSize-1;r>=0;r--) if(boardState[r][col]===null) return r;
  return -1;
}
function dropInColumn(col,isComputer){
  if(gameOver||animating)return;
  if(gameMode==="computer"&&currentPlayer===1&&!isComputer)return;
  const row=getOpenRow(col);
  if(row<0)return;

  animating=true; computerThinking=false; updateTurnDisplay();
  const player=currentPlayer;
  boardState[row][col]=player;

  const cell=boardEl.children[row*boardSize+col];
  const tile=document.createElement("div");
  tile.className="tile drop";
  tile.style.background=gradient(playerColours[player].value);
  const h=cell.getBoundingClientRect().height;
  const gap=parseFloat(getComputedStyle(boardEl).gap)||0;
  tile.style.setProperty("--start-y",`${-((row+1)*(h+gap)+55)}px`);
  tile.style.setProperty("--drop-duration",`${0.22+row*0.035}s`);
  cell.appendChild(tile);

  tile.addEventListener("animationend",()=>{
    tile.classList.remove("drop");
    const line=findWinningLine(player);
    if(line){finishGame(player,line);return}
    if(boardState.every(r=>r.every(v=>v!==null))){finishDraw();return}
    currentPlayer=1-currentPlayer;
    animating=false;
    updateTurnDisplay();
    if(gameMode==="computer"&&currentPlayer===1&&!gameOver) beginComputerTurn();
  },{once:true});
}
function beginComputerTurn(){
  computerThinking=true;
  updateTurnDisplay();
  setTimeout(()=>{
    computerThinking=false;
    const move=chooseComputerMove();
    if(move!==null) dropInColumn(move,true);
  },550);
}
function chooseComputerMove(){
  const legal=[];
  for(let c=0;c<boardSize;c++) if(boardState[0][c]===null) legal.push(c);

  for(const col of legal){
    const row=getOpenRow(col); boardState[row][col]=1;
    const win=!!findWinningLine(1); boardState[row][col]=null;
    if(win)return col;
  }
  for(const col of legal){
    const row=getOpenRow(col); boardState[row][col]=0;
    const block=!!findWinningLine(0); boardState[row][col]=null;
    if(block)return col;
  }

  const centre=(boardSize-1)/2;
  const scored=legal.map(col=>{
    let score=8-Math.abs(col-centre)*2;
    const row=getOpenRow(col);
    boardState[row][col]=1;
    score+=countPotential(row,col,1);
    boardState[row][col]=null;
    return {col,score:score+Math.random()*2};
  });
  scored.sort((a,b)=>b.score-a.score);
  return scored[0]?.col ?? null;
}
function countPotential(r,c,p){
  let score=0;
  const dirs=[[0,1],[1,0],[1,1],[1,-1]];
  for(const [dr,dc] of dirs){
    let same=1;
    for(const s of [-1,1]){
      for(let k=1;k<4;k++){
        const rr=r+dr*k*s, cc=c+dc*k*s;
        if(rr<0||rr>=boardSize||cc<0||cc>=boardSize)break;
        if(boardState[rr][cc]===p)same++;
        else break;
      }
    }
    score+=same*same;
  }
  return score;
}
function findWinningLine(player){
  const dirs=[[0,1],[1,0],[1,1],[1,-1]];
  for(let r=0;r<boardSize;r++){
    for(let c=0;c<boardSize;c++){
      for(const [dr,dc] of dirs){
        const line=[];
        for(let k=0;k<4;k++){
          const rr=r+dr*k,cc=c+dc*k;
          if(rr<0||rr>=boardSize||cc<0||cc>=boardSize||boardState[rr][cc]!==player)break;
          line.push(rr*boardSize+cc);
        }
        if(line.length===4)return line;
      }
    }
  }
  return null;
}
function finishGame(player,line){
  gameOver=true; animating=false; computerThinking=false;
  line.forEach(i=>boardEl.children[i].classList.add("winner"));
  turnPill.textContent=`${displayName(player)} win!`;
  messageText.textContent=gameMode==="computer"&&player===1?"🤖 Computer wins!":`🎉 ${displayName(player)} win!`;
  message.classList.remove("hidden");
  updateTurnDisplay();
  launchConfetti();
}
function finishDraw(){
  gameOver=true; animating=false; computerThinking=false;
  turnPill.textContent="It's a draw!";
  turnPill.style.background="#edf2fb";
  turnPill.style.color="#33455d";
  messageText.textContent="🤝 It's a draw!";
  message.classList.remove("hidden");
  updateTurnDisplay();
}
function launchConfetti(){
  const palette=["#ef4444","#f59e0b","#22c55e","#3b82f6","#8b5cf6","#ec4899"];
  for(let i=0;i<90;i++){
    const bit=document.createElement("div");
    bit.className="confetti";
    bit.style.left=Math.random()*100+"vw";
    bit.style.background=palette[Math.floor(Math.random()*palette.length)];
    bit.style.animationDelay=Math.random()*.8+"s";
    bit.style.transform=`rotate(${Math.random()*360}deg)`;
    document.body.appendChild(bit);
    setTimeout(()=>bit.remove(),3500);
  }
}
</script>
