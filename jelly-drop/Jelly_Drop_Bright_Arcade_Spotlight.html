<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<title>Jelly Drop - Bright Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Fredoka:wght@500;600;700&family=Lilita+One&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#071744;--blue:#0875f5;--sky:#6bd7ff;--ink:#10245a;
  --red:#ff3f6c;--orange:#ff8a2b;--yellow:#ffd84d;--green:#39d98a;--cyan:#30cfff;--purple:#8a5cff;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:'Fredoka',system-ui,sans-serif;background:#11143b;color:#fff;touch-action:none;user-select:none}
button{font:inherit}
#gameCanvas{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1;touch-action:none;cursor:grab}

/* ---------- BRIGHT ARCADE FLOATING HOME NAV ---------- */
.side-menu{
  position:fixed;
  left:18px;
  top:50%;
  transform:translateY(-50%);
  width:166px;
  display:flex;
  flex-direction:column;
  gap:12px;
  z-index:80;
  pointer-events:auto;
}
.side-menu a{
  background:#fff;
  color:#1f2937;
  text-decoration:none;
  font-weight:800;
  text-align:center;
  padding:12px 16px;
  border-radius:999px;
  border:3px solid #bfdbfe;
  box-shadow:0 6px 14px rgba(0,0,0,.15);
  touch-action:manipulation;
}
.side-menu a:hover{background:#eef6ff}
.sidebar-logo-link{
  background:transparent!important;
  border:0!important;
  box-shadow:none!important;
  padding:0!important;
}
.sidebar-logo{
  width:166px;
  padding:15px 10px 17px;
  background:linear-gradient(180deg,#fff 0%,#fff7d6 100%);
  border-radius:28px;
  box-shadow:0 7px 16px rgba(0,0,0,.16),0 7px 0 rgba(31,41,55,.10);
  transform:rotate(-1deg);
}
.sidebar-bright,.sidebar-arcade{
  display:flex;
  justify-content:center;
  align-items:center;
  white-space:nowrap;
}
.sidebar-bright span{
  display:inline-block;
  font-family:'Baloo 2','Fredoka',Arial,sans-serif;
  font-weight:800;
  font-size:1.68rem;
  line-height:.9;
  color:var(--c);
  text-shadow:2px 2px 0 rgba(6,25,70,.16);
}
.sidebar-arcade{
  margin-top:7px;
  font-family:'Baloo 2','Fredoka',Arial,sans-serif;
  font-weight:800;
  font-size:1.95rem;
  line-height:.82;
  color:#061946;
  text-shadow:2px 2px 0 rgba(6,25,70,.16);
}

@media(max-width:960px){
  .side-menu{
    left:12px;
    top:12px;
    transform:none;
    width:auto;
    flex-direction:row;
    gap:8px;
  }
  .sidebar-logo{display:none}
  .side-menu a{
    padding:9px 16px;
    border-width:2px;
    box-shadow:0 5px 12px rgba(0,0,0,.14);
  }
}


@media(max-width:650px){.side-menu{top:auto;bottom:68px;left:10px;transform:none}}

/* ---------- MODERN BRIGHT ARCADE MENU ---------- */

/* JELLY DROP — atmospheric arcade splash. Standalone UI: no gameplay changes. */
.start-screen{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:stretch;overflow:hidden;min-height:100dvh;padding:0;isolation:isolate;color:#fff;
 background:radial-gradient(ellipse at 79% 44%,rgba(100,45,197,.48),transparent 45%),radial-gradient(ellipse at 13% 84%,rgba(9,99,180,.42),transparent 40%),linear-gradient(137deg,#071537 0%,#10154a 38%,#1b0d4d 73%,#100e37 100%);
 transition:opacity .36s ease,visibility .36s ease;}
.start-screen.hidden{opacity:0;visibility:hidden;pointer-events:none}
/* Existing floating nav remains for gameplay; the splash has its own tiny nav. */
body:has(.start-screen:not(.hidden)) .side-menu{display:none}
.intro-noise{position:absolute;inset:0;pointer-events:none;opacity:.32;z-index:-1;
 background-image:radial-gradient(rgba(187,222,255,.42) .75px,transparent .9px);background-size:30px 30px;
 mask-image:linear-gradient(90deg,transparent,black 35%,black 80%,transparent)}
.intro-beams{position:absolute;right:-25%;top:-45%;width:95%;height:190%;z-index:-1;pointer-events:none;opacity:.54;transform:rotate(-22deg);
 background:repeating-linear-gradient(90deg,transparent 0 60px,rgba(131,116,249,.055) 64px 66px,transparent 74px 145px)}
.intro-orb{position:absolute;z-index:-1;pointer-events:none;border-radius:50%;filter:blur(5px);opacity:.6}
.intro-orb-one{width:440px;height:440px;right:-150px;top:18%;background:radial-gradient(circle,#9138dd3b,transparent 67%)}
.intro-orb-two{width:460px;height:460px;left:-230px;bottom:-250px;background:radial-gradient(circle,#14b8ff33,transparent 67%)}
.intro-spark{position:absolute;z-index:0;width:8px;height:8px;transform:rotate(45deg);background:#fff;border-radius:2px;opacity:.52;box-shadow:0 0 21px #a6f8ff;animation:floatSpark 6s ease-in-out infinite}
.intro-spark-a{left:18%;top:23%}.intro-spark-b{left:47%;top:72%;animation-delay:-2.1s}.intro-spark-c{right:13%;top:13%;animation-delay:-3.4s}
@keyframes floatSpark{0%,100%{transform:translateY(0) rotate(45deg) scale(.7);opacity:.25}50%{transform:translateY(-16px) rotate(45deg) scale(1.15);opacity:.85}}
.intro-topbar{position:relative;z-index:4;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:25px max(32px,calc((100vw - 1290px)/2)) 0;flex:0 0 auto}
.intro-brand{display:inline-flex;align-items:center;gap:11px;color:#f7fbff;text-decoration:none;font-family:'Baloo 2',sans-serif;font-size:1.01rem;font-weight:800;letter-spacing:.08em;line-height:1}
.intro-brand b{color:#9fcaff}.intro-brand-mark{display:grid;grid-template-columns:repeat(2,10px);gap:3px;transform:rotate(-8deg)}
.intro-brand-mark i{width:10px;height:10px;border-radius:4px;box-shadow:inset 0 2px 2px #ffffff75,0 3px 5px #0003}
.intro-brand-mark i:nth-child(1){background:#ff548c}.intro-brand-mark i:nth-child(2){background:#ffc647}.intro-brand-mark i:nth-child(3){background:#41deaa}.intro-brand-mark i:nth-child(4){background:#41b6ff}
.intro-top-actions{display:flex;align-items:center;gap:10px}
.intro-home,.menu-sound{display:grid;place-items:center;width:43px;height:43px;padding:0;border:1px solid #ffffff37;border-radius:14px;background:#ffffff14;color:#e1f4ff;cursor:pointer;text-decoration:none;backdrop-filter:blur(9px);box-shadow:inset 0 1px 0 #ffffff18;transition:background .16s,transform .16s}
.intro-home:hover,.menu-sound:hover{background:#ffffff2e;transform:translateY(-1px)}
.menu-sound{font-size:1.06rem}
.intro-main{position:relative;z-index:2;flex:1 0 auto;display:grid;grid-template-columns:minmax(350px,.96fr) minmax(450px,1.04fr);align-items:center;gap:min(2vw,26px);width:min(1360px,100%);padding:10px 42px 10px;margin:0 auto}
.intro-copy{position:relative;z-index:3;margin-top:0}
.intro-eyebrow{display:flex;align-items:center;gap:10px;color:#b8c7ff;font-size:.74rem;letter-spacing:.2em;font-weight:800;margin-bottom:17px}
.intro-live-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#53f0aa;box-shadow:0 0 0 5px #53f0aa21,0 0 18px #53f0aa90}
.intro-title{margin:0;display:flex;flex-direction:column;align-items:flex-start;font-family:'Lilita One','Baloo 2',Impact,sans-serif;font-weight:900;letter-spacing:-.024em;line-height:.83;filter:drop-shadow(0 15px 13px #070b2b80)}
.intro-title-jelly,.intro-title-drop{display:block;white-space:nowrap;font-size:clamp(5.4rem,10vw,9.8rem);-webkit-text-stroke:clamp(2px,.24vw,3px) #130c3f;paint-order:stroke fill}
.intro-title-jelly{background:linear-gradient(180deg,#fff4ba 2%,#ffd450 25%,#fe8237 72%,#f7508b 100%);background-clip:text;-webkit-background-clip:text;color:transparent;text-shadow:0 8px 0 #b93466b3}
.intro-title-drop{margin-top:.035em;background:linear-gradient(180deg,#c8fff8 1%,#51eff4 29%,#33bbff 60%,#497cff 95%);background-clip:text;-webkit-background-clip:text;color:transparent;text-shadow:0 8px 0 #17429bc9}
.intro-title-bang{display:inline-block;transform:rotate(9deg) translateX(3px);background:linear-gradient(180deg,#fff7ac,#f8ed33,#ff9c39);background-clip:text;-webkit-background-clip:text;color:transparent}
.intro-tagline{margin:25px 0 32px;color:#b9d0ff;font-family:'Fredoka',sans-serif;font-weight:700;letter-spacing:.12em;font-size:clamp(1.02rem,1.6vw,1.35rem)}
.intro-cta-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.play-btn{border:0;position:relative;display:inline-flex;align-items:center;justify-content:center;gap:20px;min-width:235px;min-height:72px;padding:17px 26px;border-radius:19px;background:linear-gradient(160deg,#faff81 0%,#d8ff3e 37%,#80dd3e 100%);color:#113451;font-family:'Lilita One','Baloo 2',sans-serif;font-size:1.75rem;letter-spacing:.04em;box-shadow:0 9px 0 #328f43,0 17px 40px #b6ff4e38,inset 0 3px 0 #ffffffa6;cursor:pointer;transition:transform .15s,filter .15s,box-shadow .15s}
.play-btn svg{width:21px;height:21px;transition:transform .15s}.play-btn:hover{transform:translateY(-3px);filter:brightness(1.07);box-shadow:0 12px 0 #328f43,0 23px 46px #b6ff4e50,inset 0 3px 0 #ffffffa6}.play-btn:hover svg{transform:translateX(4px)}.play-btn:active{transform:translateY(5px);box-shadow:0 4px 0 #328f43,0 12px 25px #b6ff4e38}
.menu-best{display:flex;flex-direction:column;gap:3px;min-width:104px;font-family:'Baloo 2',sans-serif;font-weight:800}.menu-best span{color:#98b5e7;font-size:.69rem;letter-spacing:.16em}.menu-best strong{color:#fff;font-size:1.5rem;line-height:1;letter-spacing:.02em;text-shadow:0 0 20px #ffffff32}
/* Tilted candy board — a graphic, not the actual playfield. */
.intro-art{position:relative;width:100%;height:min(620px,65vw);min-height:480px;max-height:700px;perspective:980px;pointer-events:none}
.art-back-ring{position:absolute;border:1px solid #9d83ff40;border-radius:50%;transform:rotate(-21deg)}
.ring-one{width:90%;height:78%;left:7%;top:10%;box-shadow:0 0 55px #713af53b,inset 0 0 55px #713af526}
.ring-two{width:67%;height:90%;left:19%;top:4%;border-width:3px;opacity:.55;border-style:dashed;animation:ringFloat 16s linear infinite}
@keyframes ringFloat{50%{transform:rotate(14deg)}}
.art-board-tilt{position:absolute;inset:10% 7% 11% 13%;transform:rotate(-8deg) rotateY(-13deg) rotateX(9deg);filter:drop-shadow(25px 35px 24px #06062686);animation:boardHover 5.5s ease-in-out infinite}
@keyframes boardHover{0%,100%{translate:0 0}50%{translate:0 -11px}}
.art-board-top{position:relative;width:100%;height:100%;border-radius:35px;padding:28px;background:linear-gradient(145deg,#4a3c98,#221a70 49%,#130e50);border:9px solid #9b86fe;box-shadow:inset 0 0 0 4px #aab2ff7c,inset 0 17px 38px #0b084e8c,0 13px 0 #25146a,0 22px 0 #110936,0 28px 40px #08042388}
.art-board-top::after{content:"";position:absolute;left:8%;right:8%;bottom:7px;height:7px;border-radius:99px;background:linear-gradient(90deg,#42d4ff00,#42d4ff9a,#aa80ffbb,#42d4ff00);filter:blur(5px)}
.art-board-grid{position:relative;width:100%;height:100%;border-radius:16px;overflow:hidden;background:linear-gradient(160deg,#160d50,#291766 65%,#1d1456);box-shadow:inset 0 5px 14px #03012e9c,inset 0 -2px 0 #ffffff10;--step-x:16.6667%;--step-y:16.6667%;
 background-image:repeating-linear-gradient(0deg,transparent 0 calc(16.6667% - 1px),#ffffff0b calc(16.6667% - 1px) 16.6667%),repeating-linear-gradient(90deg,transparent 0 calc(16.6667% - 1px),#ffffff0b calc(16.6667% - 1px) 16.6667%),linear-gradient(160deg,#160d50,#291766 65%,#1d1456)}
.arcade-jelly{position:absolute;left:calc(var(--c)*16.6667% + 1.05%);top:calc(var(--r)*16.6667% + 1.05%);width:14.55%;height:14.55%;border-radius:23%;background:linear-gradient(152deg,#ffffffb0 0%,var(--hi) 13%,var(--base) 47%,var(--lo) 94%);box-shadow:inset 0 3px 4px #ffffff90,inset 0 -7px 10px #0506263a,0 5px 0 var(--shadow),0 9px 9px #0007;animation:jellyBreathe 3.2s ease-in-out infinite;animation-delay:var(--delay)}
.arcade-jelly::after,.falling-jelly::after,.art-jelly-single::after{content:"";position:absolute;left:17%;top:10%;width:45%;height:23%;border-radius:50%;background:#fff9;transform:rotate(-19deg);filter:blur(.4px)}
.arcade-jelly.pink{--hi:#ffb9e7;--base:#ff4e9c;--lo:#c32278;--shadow:#8e164f}
.arcade-jelly.violet{--hi:#d5a7ff;--base:#a358fc;--lo:#6035d6;--shadow:#3b209e}
.arcade-jelly.blue{--hi:#b4eaff;--base:#32c3ff;--lo:#1176df;--shadow:#084b99}
.arcade-jelly.lime{--hi:#c0ff9e;--base:#53e89b;--lo:#22ad6e;--shadow:#197d59}
.arcade-jelly.coral{--hi:#ffcaa0;--base:#ff9b48;--lo:#f05b3b;--shadow:#b64225}
.arcade-jelly.gold{--hi:#fff5a3;--base:#ffe04d;--lo:#e6a12c;--shadow:#ac7515}
.arcade-jelly.aqua{--hi:#bffffe;--base:#4ff4ec;--lo:#23a9bb;--shadow:#0d6170}
@keyframes jellyBreathe{0%,100%{scale:1}50%{scale:1.035}}
.art-pop-burst{position:absolute;border:5px solid #a1ff5d;box-shadow:0 0 30px #b7ff6a9e,0 0 0 10px #b7ff6a22;border-radius:50%;width:110px;height:110px;left:37%;top:47%;animation:popSplash 2.5s ease-out infinite;pointer-events:none}
.burst-two{left:62%;top:64%;border-color:#fff6a5;animation-delay:-1.15s}
@keyframes popSplash{0%{opacity:0;transform:scale(.3)}18%{opacity:.92}100%{opacity:0;transform:scale(1.7)}}
.art-falling-piece{position:absolute;right:0%;top:1%;width:166px;height:135px;transform:rotate(14deg);filter:drop-shadow(8px 15px 7px #06073e80);animation:pieceFloat 3.5s ease-in-out infinite}
@keyframes pieceFloat{0%,100%{transform:translateY(-8px) rotate(14deg)}50%{transform:translateY(10px) rotate(10deg)}}
.falling-jelly{position:absolute;width:53px;height:53px;border-radius:15px;background:linear-gradient(145deg,#fff6b2,#ffdf42 44%,#f8a725);box-shadow:inset 0 4px 5px #fffba4,0 7px 0 #b37e1b,0 12px 18px #09063b80}
.falling-jelly.one{left:50px;top:8px}.falling-jelly.two{left:0;top:60px}.falling-jelly.three{left:50px;top:60px}
.falling-trail{position:absolute;width:7px;height:36px;border-radius:5px;background:linear-gradient(#b6fcff00,#e7ffffba);transform:rotate(14deg)}.trail-one{top:-30px;left:73px}.trail-two{top:-2px;left:33px;height:20px}
.art-jelly-single{position:absolute;width:60px;height:60px;border-radius:19px;box-shadow:inset 0 4px 9px #ffffff8a,inset 0 -7px 12px #0002,0 8px 0 #0003,0 17px 25px #0006;animation:lonelyJelly 5s ease-in-out infinite}
.single-a{left:5%;top:4%;background:linear-gradient(140deg,#ffc6e2,#f75ca8,#ba2c85);transform:rotate(-15deg);animation-delay:-1.2s}
.single-b{right:5%;bottom:5%;width:45px;height:45px;border-radius:13px;background:linear-gradient(140deg,#c6f3ff,#3dc9fb,#1e6ede);transform:rotate(20deg);animation-delay:-3.1s}
.single-c{left:6%;bottom:8%;width:42px;height:42px;border-radius:13px;background:linear-gradient(140deg,#c2ffaa,#5ceaa1,#27b06a);transform:rotate(-14deg);animation-delay:-.2s}
@keyframes lonelyJelly{50%{translate:0 -17px}}
.art-star{position:absolute;color:#e8ffff;text-shadow:0 0 20px #8fceffcc;z-index:2;font-size:37px;animation:starShine 3s ease-in-out infinite}
.star-one{left:14%;top:26%}.star-two{right:11%;top:30%;font-size:24px;animation-delay:-1.1s}.star-three{left:31%;bottom:5%;font-size:20px;animation-delay:-2.1s}
@keyframes starShine{0%,100%{opacity:.35;transform:scale(.7) rotate(-12deg)}50%{opacity:1;transform:scale(1.15) rotate(12deg)}}
.intro-footer{display:flex;align-items:center;justify-content:center;gap:12px;padding:0 20px 24px;opacity:.64}
.intro-footer-line{width:64px;height:1px;background:linear-gradient(90deg,transparent,#8f91ca88,transparent)}
.intro-footer-dots{display:flex;gap:6px}.intro-footer-dots i{width:6px;height:6px;border-radius:50%;background:#7f9ac2}.intro-footer-dots i:nth-child(1){background:#f864a3}.intro-footer-dots i:nth-child(2){background:#ffcf53}.intro-footer-dots i:nth-child(3){background:#53e7a9}.intro-footer-dots i:nth-child(4){background:#56c5fa}.intro-footer-dots i:nth-child(5){background:#b090f8}
@media(max-width:950px){
 .intro-main{grid-template-columns:minmax(280px,.95fr) minmax(310px,1.05fr);gap:6px;padding:20px 26px}
 .intro-title-jelly,.intro-title-drop{font-size:clamp(4.6rem,10.3vw,7.6rem)}
 .intro-art{height:490px;min-height:400px}
 .art-board-top{padding:18px;border-radius:25px;border-width:7px}
 .art-falling-piece{transform-origin:center;scale:.8;right:-2%}
 .intro-cta-row{gap:12px}.play-btn{min-width:198px;min-height:65px;font-size:1.55rem}
}
@media(max-width:670px){
 .start-screen{min-height:100dvh;overflow-y:auto}
 .intro-topbar{padding:16px 17px 0}
 .intro-brand{font-size:.9rem}.intro-home,.menu-sound{width:38px;height:38px;border-radius:12px}
 .intro-main{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:20px 13px 0}
 .intro-copy{display:contents}
 .intro-eyebrow{order:1;font-size:.58rem;letter-spacing:.16em;margin:2px 0 12px}
 .intro-title{order:2;align-items:center;filter:drop-shadow(0 9px 9px #070b2b80)}
 .intro-title-jelly,.intro-title-drop{font-size:clamp(5rem,19.3vw,8rem)}
 .intro-tagline{order:3;margin:17px 0 1px;font-size:.9rem;text-align:center}
 .intro-art{order:4;height:min(360px,44dvh);width:min(430px,100%);min-height:230px;max-height:350px}
 .art-board-tilt{inset:10% 8% 10% 12%}
 .art-board-top{padding:12px;border-width:6px;border-radius:20px}
 .art-falling-piece{scale:.67;top:0;right:-7%}
 .art-jelly-single{scale:.7}
 .art-pop-burst{scale:.75}
 .intro-cta-row{order:5;justify-content:center;flex-direction:column;gap:15px;width:100%;margin:-4px 0 0}
 .play-btn{min-width:min(295px,84vw);min-height:61px;font-size:1.45rem;padding:13px 20px}
 .menu-best{flex-direction:row;gap:10px;align-items:center}.menu-best strong{font-size:1.22rem}
 .intro-footer{padding:8px 12px 14px}
}
@media(max-width:390px){.intro-topbar{padding:12px 12px 0}.intro-brand{font-size:.8rem}.intro-title-jelly,.intro-title-drop{font-size:19vw}.intro-art{height:265px;min-height:220px}.intro-tagline{margin-top:12px}.intro-cta-row{margin-top:-3px}}
@media(max-height:670px) and (min-width:671px){
 .intro-topbar{padding-top:14px}.intro-main{padding-top:6px;padding-bottom:4px}
 .intro-title-jelly,.intro-title-drop{font-size:clamp(4rem,8.1vw,7rem)}.intro-tagline{margin:15px 0 22px}
 .intro-art{height:435px;min-height:400px}.intro-footer{padding-bottom:12px}.play-btn{min-height:61px;padding:12px 22px}
}
@media(prefers-reduced-motion:reduce){.intro-spark,.ring-two,.art-board-tilt,.arcade-jelly,.art-pop-burst,.art-falling-piece,.art-jelly-single,.art-star{animation:none}}

/* ---------- HUD ---------- */
.hud{position:fixed;left:0;right:0;top:0;z-index:10;display:none;pointer-events:none;padding:calc(10px + env(safe-area-inset-top)) 18px 0}.hud.show{display:block}.hud-inner{max-width:930px;margin:0 auto;display:grid;grid-template-columns:minmax(65px,1fr) minmax(260px,420px) minmax(65px,1fr);align-items:start;gap:12px}.score-card{display:flex;flex-direction:column;gap:0}.score-card.right{text-align:right}.hud-label{font-family:'Baloo 2';font-weight:800;font-size:.68rem;letter-spacing:.1em;color:#b8d8ff;text-shadow:0 2px 6px rgba(0,0,0,.35)}.hud-value{font-family:'Lilita One';font-size:clamp(1.55rem,3vw,2.25rem);line-height:1;color:#fff;-webkit-text-stroke:1.5px rgba(4,17,55,.72);paint-order:stroke fill;text-shadow:0 5px 12px rgba(0,0,0,.36)}
/* Encouraging messages take the place of the former power meter (the Rush mechanic remains intact). */
/* Clear-result praise is a bold, colourful arcade reward (not a subtle HUD label). */
.affirmation-box{position:relative;isolation:isolate;min-height:86px;display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 20px;border:4px solid #fff;border-radius:23px;background:linear-gradient(140deg,#ffe967 0%,#ffbc47 48%,#ff865e 100%);box-shadow:0 9px 0 #a94c46,0 15px 30px rgba(0,0,0,.4),0 0 38px rgba(255,213,73,.38),inset 0 2px 0 rgba(255,255,255,.76);text-align:center;pointer-events:none;opacity:0;visibility:hidden;transform:translateY(-24px) scale(.68) rotate(-4deg);will-change:transform,opacity}
.affirmation-box::before{content:'';position:absolute;inset:4px;border-radius:17px;border:2px dashed rgba(255,255,255,.56);pointer-events:none;z-index:-1}
.affirmation-box.show{visibility:visible;animation:praiseBurst .52s cubic-bezier(.17,1.15,.35,1) both}

#startScreen.jd-spotlight{
  position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#3bbaf2 0%,#72d0f8 54%,#d2f4ff 100%);
  color:#123c72;overflow-x:hidden;overflow-y:auto;
  min-height:100vh;min-height:100dvh;padding:0;isolation:isolate;
  transition:opacity .36s ease, visibility .36s ease;
}
#startScreen.jd-spotlight.hidden{opacity:0;visibility:hidden;pointer-events:none}
.jd-atmosphere{position:absolute;inset:0;pointer-events:none;z-index:-1;overflow:hidden}
.jd-cloud{position:absolute;width:180px;height:55px;background:#eafaffdd;border-radius:999px;filter:drop-shadow(0 10px 14px #2e9dcd18);opacity:.8;animation:jdDrift 35s linear infinite}
.jd-cloud:before,.jd-cloud:after{content:"";position:absolute;border-radius:50%;background:#eafaffee}
.jd-cloud:before{width:85px;height:80px;left:23px;bottom:14px}
.jd-cloud:after{width:92px;height:90px;right:21px;bottom:12px}
.jd-cloud-one{top:10%;left:72%;animation-duration:45s;animation-delay:-20s;scale:.72}
.jd-cloud-two{top:53%;left:-6%;animation-duration:55s;animation-delay:-12s;scale:1.3;opacity:.65}
.jd-cloud-three{top:81%;left:69%;animation-duration:64s;animation-delay:-33s;scale:1.8;opacity:.5}
.jd-cloud-four{top:32%;left:27%;animation-duration:68s;animation-delay:-45s;scale:.55;opacity:.45}
@keyframes jdDrift{0%{translate:-12vw 0}100%{translate:25vw 0}}
.jd-orbit{position:absolute;right:-8%;top:10%;width:min(66vw,910px);aspect-ratio:1;border:2px solid #198bdb18;border-radius:50%;transform:rotate(-15deg)}
.jd-orbit-two{right:1%;top:3%;width:min(62vw,820px);border-style:dashed;border-color:#0875f516;transform:rotate(23deg)}
.jd-topbar{position:relative;z-index:5;display:flex;justify-content:space-between;align-items:center;width:min(1450px,100%);margin:0 auto;padding:24px clamp(22px,4.5vw,72px) 0}
.jd-brand{display:inline-flex;gap:12px;align-items:center;text-decoration:none;color:#083c79;font-family:'Fredoka',sans-serif;font-weight:700;font-size:1rem;letter-spacing:.12em;white-space:nowrap}
.jd-brand b{color:#275e98}.jd-brand-symbol{display:grid;grid-template-columns:repeat(2,10px);gap:4px;transform:rotate(-8deg)}
.jd-brand-symbol i{width:10px;height:10px;border-radius:3px;box-shadow:0 2px 3px #0f418026}
.jd-brand-symbol i:nth-child(1){background:#ff4984}.jd-brand-symbol i:nth-child(2){background:#ffca36}.jd-brand-symbol i:nth-child(3){background:#4cdaa0}.jd-brand-symbol i:nth-child(4){background:#4dc5f5}
.jd-actions{display:flex;align-items:center;gap:9px}
.jd-home,.jd-sound{display:grid;place-items:center;flex:0 0 auto;width:47px;height:47px;border:1.5px solid #ffffffa8;border-radius:15px;background:#dff6ffb8;color:#163d71;text-decoration:none;box-shadow:0 8px 16px #1a7fbc16;cursor:pointer}
.jd-sound{font-size:1.1rem}.jd-home:hover,.jd-sound:hover{background:#fff;transform:translateY(-2px)}
.jd-spotlight-content{position:relative;z-index:2;display:grid;grid-template-columns:minmax(340px,.94fr) minmax(420px,1.06fr);align-items:center;gap:10px;flex:1;width:min(1450px,100%);margin:0 auto;padding:8px clamp(22px,4.5vw,72px) 36px;min-height:0}

.jd-title span,.jd-title strong{display:block;font:inherit;white-space:nowrap;-webkit-text-stroke:2.5px #173c73;paint-order:stroke fill}
.jd-title span{font-size:clamp(8rem,13.5vw,13.2rem);color:#fff;text-shadow:0 7px 0 #8daed0}
.jd-title strong{font-size:clamp(8.2rem,14.6vw,14rem);color:#ffdb34;text-shadow:0 8px 0 #df9320}

.jd-play:hover{transform:translateY(-3px);filter:brightness(1.04)}.jd-play:active{transform:translateY(4px)}

.jd-jelly-sculpture{width:min(100%,750px);max-height:min(70vh,680px);height:auto;object-fit:contain;filter:drop-shadow(0 17px 17px #17568a25);animation:jdFloat 5s ease-in-out infinite;pointer-events:none;user-select:none;-webkit-user-drag:none}
@keyframes jdFloat{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-13px) rotate(1deg)}}
.jd-spectrum{position:absolute;z-index:10;bottom:0;left:0;right:0;height:9px;display:grid;grid-template-columns:repeat(6,1fr);overflow:hidden}
.jd-spectrum span:nth-child(1){background:#ff4b88}.jd-spectrum span:nth-child(2){background:#ff8b2b}.jd-spectrum span:nth-child(3){background:#ffda40}.jd-spectrum span:nth-child(4){background:#42d899}.jd-spectrum span:nth-child(5){background:#31c9fa}.jd-spectrum span:nth-child(6){background:#9865f8}

(() => {
'use strict';
const $=s=>document.querySelector(s);
const canvas=$('#gameCanvas'), ctx=canvas.getContext('2d');
const startScreen=$('#startScreen'), hud=$('#hud'), callout=$('#callout'), hintBubble=$('#hintBubble');
const scoreText=$('#scoreText'), bestText=$('#bestText'), menuBest=$('#menuBest');
const affirmationBox=$('#affirmationBox'), affirmationText=$('#affirmationText');
const gameOverModal=$('#gameOverModal');
let W=innerWidth,H=innerHeight,DPR=Math.min(2,devicePixelRatio||1);

let renderTime=0, shake=0, glowPulse=0, resolveToken=0, hint=null;
// Fifty short, game-style praise messages, shuffled without repeats until all 50 are used.
const AFFIRMATIONS=Object.freeze([

let affirmationDeck=[],lastAffirmationIndex=-1,affirmationTimer=null;
function clearAffirmation(){
  if(affirmationTimer!==null){clearTimeout(affirmationTimer);affirmationTimer=null}
  affirmationBox.classList.remove('show');
  affirmationBox.setAttribute('aria-hidden','true');
  affirmationText.textContent='';
}
function showAffirmation(){
  if(!affirmationDeck.length){
    affirmationDeck=AFFIRMATIONS.map((_,i)=>i);
    for(let i=affirmationDeck.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [affirmationDeck[i],affirmationDeck[j]]=[affirmationDeck[j],affirmationDeck[i]];
    }
    // Avoid repeating the most recently displayed phrase when the deck restarts.
    if(affirmationDeck[affirmationDeck.length-1]===lastAffirmationIndex){
      [affirmationDeck[0],affirmationDeck[affirmationDeck.length-1]]=[affirmationDeck[affirmationDeck.length-1],affirmationDeck[0]];
    }
  }
  const index=affirmationDeck.pop();lastAffirmationIndex=index;
  if(affirmationTimer!==null){clearTimeout(affirmationTimer);affirmationTimer=null}
  affirmationBox.classList.remove('show');
  affirmationText.textContent=AFFIRMATIONS[index];
  affirmationBox.dataset.tone=['gold','pink','blue','mint'][index%4];
  affirmationBox.setAttribute('aria-hidden','false');
  void affirmationBox.offsetWidth; // Restart the entrance when successive cascades clear.
  affirmationBox.classList.add('show');
  affirmationTimer=setTimeout(()=>{
    affirmationBox.classList.remove('show');
    affirmationBox.setAttribute('aria-hidden','true');
    affirmationTimer=null;
  },3400);
}
const ROWS=9,COLS=9;
const COLORS=[

  {id:5,hex:'#8b62ff',hi:'#c6b4ff',lo:'#5430c8'}

const SHAPES=[
  [[0,0]],

  [[0,0],[1,0],[2,0],[2,1],[2,2]], [[0,0],[1,0],[1,1],[1,2],[2,2]]

function safeGetBest(){try{return Number(localStorage.getItem('jellyDropReimaginedBest')||0)}catch{return 0}}
function safeSetBest(v){try{localStorage.setItem('jellyDropReimaginedBest',String(v))}catch{}}
function fmt(n){return Math.round(n).toLocaleString()}
menuBest.textContent=fmt(best);bestText.textContent=fmt(best);

function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(2,devicePixelRatio||1);canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);layout();}
function layout(){
  const top=H<700?72:92;
  const bottomReserve=H<700?145:175;
  let size=Math.min(W<700?W-22:Math.min(W*.58,650),H-top-bottomReserve);
  size=Math.max(270,size);
  boardRect.size=size;boardRect.cell=size/COLS;boardRect.x=(W-size)/2;boardRect.y=top;
  trayY=Math.min(H-68,boardRect.y+size+(H<700?54:70));trayCardW=Math.min(210,Math.max(105,size/3.15));
  trayRects=[0,1,2].map(i=>({cx:W/2+(i-1)*(trayCardW+10),cy:trayY,w:trayCardW,h:H<700?86:104}));
}
addEventListener('resize',resize);resize();

function emptyBoard(){return Array.from({length:ROWS},()=>Array(COLS).fill(null))}
function resetGame(){
  clearAffirmation();
  resolveToken++;phase='playing';board=emptyBoard();tray=[];score=0;totalCleared=0;longestChain=1;power=0;rush=false;rushMoves=0;particles=[];floaters=[];shockwaves=[];drag=null;hoverPlacement=null;hint=null;lastInput=performance.now();
  updateHud();generateTray(true);gameOverModal.classList.remove('show');startScreen.classList.add('hidden');hud.classList.add('show');$('#gameSound').style.display='block';

  const C=COLORS[colorIndex],s=size*scale,x=cx-s/2,y=cy-s/2,r=s*.27;

  ctx.shadowColor=C.hex+'80';ctx.shadowBlur=s*.24;ctx.shadowOffsetY=s*.1;
  const g=ctx.createLinearGradient(x,y,x+s,y+s);
  g.addColorStop(0,'#ffffff');g.addColorStop(.08,C.hi);g.addColorStop(.48,C.hex);g.addColorStop(.82,C.lo);g.addColorStop(1,C.lo);
  ctx.fillStyle=g;rr(x,y,s,s,r);ctx.fill();ctx.shadowBlur=0;ctx.shadowOffsetY=0;
  ctx.save();rr(x,y,s,s,r);ctx.clip();
  const top=ctx.createLinearGradient(0,y,0,y+s*.62);
  top.addColorStop(0,'rgba(255,255,255,.78)');top.addColorStop(.36,'rgba(255,255,255,.20)');top.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=top;ctx.fillRect(x,y,s,s*.68);
  const lower=ctx.createLinearGradient(0,y+s*.45,0,y+s);
  lower.addColorStop(0,'rgba(255,255,255,0)');lower.addColorStop(1,'rgba(0,0,0,.12)');
  ctx.fillStyle=lower;ctx.fillRect(x,y+s*.38,s,s*.62);
  ctx.fillStyle='rgba(255,255,255,.58)';ctx.beginPath();ctx.ellipse(x+s*.30,y+s*.24,s*.22,s*.12,-.35,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.22)';ctx.beginPath();ctx.ellipse(x+s*.65,y+s*.29,s*.11,s*.055,.35,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(x+s*.72,y+s*.70,s*.06,0,Math.PI*2);ctx.fill();
  ctx.restore();
  ctx.strokeStyle='rgba(255,255,255,.32)';ctx.lineWidth=Math.max(1,s*.026);rr(x+1.2,y+1.2,s-2.4,s-2.4,Math.max(2,r-1.2));ctx.stroke();
  ctx.restore();
}
function drawTray(t){
  if(phase==='menu')return;const boardBottom=boardRect.y+boardRect.size;
  // tray label
  ctx.save();ctx.textAlign='center';ctx.fillStyle='rgba(205,230,255,.84)';ctx.font='800 12px "Baloo 2",sans-serif';ctx.fillText('DRAG A SHAPE',W/2,trayY-(H<700?51:62));ctx.restore();
  trayRects.forEach((r,i)=>{const p=tray[i];ctx.save();const active=drag?.index===i||(guidesOn&&hint?.piece===p);ctx.shadowColor=active?'rgba(255,226,76,.55)':'rgba(0,0,0,.28)';ctx.shadowBlur=active?24:14;ctx.fillStyle=p?.used?'rgba(12,24,69,.20)':'rgba(12,24,69,.58)';rr(r.cx-r.w/2,r.cy-r.h/2,r.w,r.h,22);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle=active?'rgba(255,235,100,.88)':'rgba(255,255,255,.12)';ctx.lineWidth=active?2.5:1.5;rr(r.cx-r.w/2,r.cy-r.h/2,r.w,r.h,22);ctx.stroke();ctx.restore();if(!p||p.used)return;
    const d=shapeDims(p.shape),cs=Math.min(boardRect.cell*.74,r.w/(d.w+1.05),r.h/(d.h+1.00));const ox=r.cx-d.w*cs/2+cs/2,oy=r.cy-d.h*cs/2+cs/2;
    p.shape.forEach(([x,y],j)=>drawJelly(ox+x*cs,oy+y*cs,cs*.94,p.colors[j],1+.02*Math.sin(t*.004+j),t+j*70));
  });
  if(drag){const p=drag.piece,d=shapeDims(p.shape),cs=Math.min(boardRect.cell*.98,59);const ox=drag.px-d.w*cs/2+cs/2,oy=drag.py-drag.lift-d.h*cs/2+cs/2;p.shape.forEach(([x,y],j)=>drawJelly(ox+x*cs,oy+y*cs,cs*.95,p.colors[j],1.06,t+j*60,.96))}
}
function spawnPop(r,c,color){const x=boardRect.x+(c+.5)*boardRect.cell,y=boardRect.y+(r+.5)*boardRect.cell,C=COLORS[color].hex;for(let i=0;i<11;i++){const a=Math.random()*Math.PI*2,sp=45+Math.random()*110;particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-40,life:1,r:2+Math.random()*5,color:C,spin:Math.random()*6.28})}shockwaves.push({x,y,t:performance.now(),color:C})}
function drawFx(t,dt){
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt*1.55;if(p.life<=0){particles.splice(i,1);continue}p.vy+=180*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.spin+=dt*5);rr(-p.r,-p.r,p.r*2,p.r*2,p.r*.55);ctx.fill();ctx.restore()}ctx.globalAlpha=1;
  for(let i=shockwaves.length-1;i>=0;i--){const s=shockwaves[i],p=(t-s.t)/480;if(p>=1){shockwaves.splice(i,1);continue}ctx.globalAlpha=(1-p)*.65;ctx.strokeStyle=s.color;ctx.lineWidth=4*(1-p)+1;ctx.beginPath();ctx.arc(s.x,s.y,8+p*55,0,Math.PI*2);ctx.stroke()}ctx.globalAlpha=1;
  if(rush){ctx.save();ctx.globalCompositeOperation='screen';for(let i=0;i<8;i++){const x=(i*137+t*.045)%W,y=(i*79+t*.075)%H;ctx.fillStyle=i%2?'rgba(255,102,219,.09)':'rgba(87,235,255,.09)';ctx.beginPath();ctx.arc(x,y,18+12*Math.sin(t*.002+i),0,Math.PI*2);ctx.fill()}ctx.restore()}
}
function drawDanger(){if(!guidesOn||!board)return;let top=ROWS;for(let r=0;r<ROWS;r++)if(board[r].some(Boolean)){top=r;break}if(top>2)return;const a=.35+.2*Math.sin(renderTime*.009);ctx.save();ctx.fillStyle=`rgba(255,71,101,${a})`;ctx.fillRect(boardRect.x,boardRect.y,boardRect.size,boardRect.cell*.12);ctx.shadowColor='#ff315c';ctx.shadowBlur=20;ctx.strokeStyle=`rgba(255,75,110,${a+.2})`;ctx.lineWidth=2;ctx.strokeRect(boardRect.x+1,boardRect.y+1,boardRect.size-2,boardRect.cell*.92);ctx.restore()}
function frame(t){const dt=Math.min(.033,(t-renderTime||16)/1000);renderTime=t;drawBg(t);if(phase!=='menu'){drawBoard(t);drawDanger();drawTray(t);drawFx(t,dt);if(guidesOn)maybeHint(t);else hint=null}requestAnimationFrame(frame)}requestAnimationFrame(frame);
function maybeHint(t){if(!guidesOn||phase!=='playing'||drag){hint=null;return}if(t-lastInput<6500){hint=null;return}if(!hint){for(const p of tray){if(p.used)continue;const fit=firstFit(p);if(fit){hint={piece:p,...fit};break}}}}

// ---------- ROBUST DRAG INPUT ----------
function clientToGame(clientX,clientY){const r=canvas.getBoundingClientRect();return {x:clientX-r.left,y:clientY-r.top}}
function trayIndexAt(x,y){
  for(let i=0;i<trayRects.length;i++){
    const r=trayRects[i],pad=10;
    if(Math.abs(x-r.cx)<=r.w/2+pad&&Math.abs(y-r.cy)<=r.h/2+pad&&!tray[i]?.used)return i;
  }
  return -1;
}
function startInput(clientX,clientY,type='mouse',ev){
  if(phase!=='playing'||drag)return false;
  const p=clientToGame(clientX,clientY),i=trayIndexAt(p.x,p.y);
  if(i<0)return false;
  beginDrag(i,p.x,p.y,type);
  canvas.style.cursor='grabbing';
  hintBubble.classList.remove('show');
  ev?.preventDefault?.();
  return true;
}
function moveInput(clientX,clientY,ev){
  if(!drag)return false;
  const p=clientToGame(clientX,clientY);
  updateDrag(p.x,p.y);
  ev?.preventDefault?.();
  return true;
}
function finishInput(ev){
  if(!drag)return false;
  endDrag();
  canvas.style.cursor='grab';
  ev?.preventDefault?.();
  return true;
}
function cancelInput(){drag=null;hoverPlacement=null;canvas.style.cursor='grab'}

// Listen at window level in capture phase so restrictive HTML viewers or HUD overlays
// cannot swallow the drag before the game receives it.
if('PointerEvent' in window){
  window.addEventListener('pointerdown',e=>startInput(e.clientX,e.clientY,e.pointerType||'mouse',e),{capture:true,passive:false});
  window.addEventListener('pointermove',e=>moveInput(e.clientX,e.clientY,e),{capture:true,passive:false});
  window.addEventListener('pointerup',e=>finishInput(e),{capture:true,passive:false});
  window.addEventListener('pointercancel',cancelInput,{capture:true});
}else{
  window.addEventListener('mousedown',e=>startInput(e.clientX,e.clientY,'mouse',e),true);
  window.addEventListener('mousemove',e=>moveInput(e.clientX,e.clientY,e),true);
  window.addEventListener('mouseup',e=>finishInput(e),true);
  window.addEventListener('touchstart',e=>{const t=e.changedTouches?.[0];if(t)startInput(t.clientX,t.clientY,'touch',e)},{capture:true,passive:false});
  window.addEventListener('touchmove',e=>{const t=e.changedTouches?.[0];if(t)moveInput(t.clientX,t.clientY,e)},{capture:true,passive:false});
  window.addEventListener('touchend',e=>finishInput(e),{capture:true,passive:false});
  window.addEventListener('touchcancel',cancelInput,{capture:true});
}

canvas.addEventListener('dragstart',e=>e.preventDefault());

$('#playBtn').onclick=()=>{ensureAudio();resetGame()};$('#againBtn').onclick=()=>{ensureAudio();resetGame()};$('#menuBtn').onclick=goMenu;
addEventListener('keydown',e=>{if(phase==='menu'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();ensureAudio();resetGame()}});
})();
</script>
