<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>100 - Bright Arcade</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Baloo+2:wght@800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#061946;--blue:#0875f5;--purple:#7030d8;--yellow:#facc15;
  --green:#ef4444;--red:#ef174d;--orange:#f97316;--sky:#38bdf8;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:'Fredoka',Arial,sans-serif;color:var(--navy);
  background:linear-gradient(180deg,#38bdf8 0%,#7dd3fc 48%,#dff7ff 100%);
  overflow-x:hidden;
}
button{font:inherit;touch-action:manipulation}

/* Bright Arcade sky */
.sky-background{
  position:fixed;inset:0;z-index:-10;overflow:hidden;pointer-events:none;
  background:linear-gradient(180deg,#38bdf8 0%,#7dd3fc 48%,#dff7ff 100%);
}
.sky-background::before{
  content:"";position:absolute;top:42px;left:42px;width:108px;height:108px;border-radius:50%;
  background:#ffd60a;box-shadow:0 0 35px rgba(255,214,10,.7),0 0 78px rgba(255,214,10,.4);
}
.cloud{
  position:absolute;width:220px;height:74px;background:rgba(255,255,255,.92);
  border-radius:999px;filter:drop-shadow(0 9px 10px rgba(14,116,144,.16));
  opacity:.88;animation:cloudDrift linear infinite;
}
.cloud::before,.cloud::after{content:"";position:absolute;background:rgba(255,255,255,.96);border-radius:50%}
.cloud::before{width:92px;height:92px;left:32px;top:-38px}
.cloud::after{width:118px;height:118px;right:24px;top:-58px}
.cloud.one{top:10%;left:-260px;transform:scale(.9);animation-duration:54s}
.cloud.two{top:27%;left:-320px;transform:scale(1.25);animation-duration:72s;animation-delay:-18s;opacity:.78}
.cloud.three{top:52%;left:-280px;transform:scale(.75);animation-duration:64s;animation-delay:-34s;opacity:.72}
.cloud.four{top:72%;left:-360px;transform:scale(1.45);animation-duration:86s;animation-delay:-42s;opacity:.62}
.cloud.five{top:3%;left:-240px;transform:scale(.58);animation-duration:47s;animation-delay:-25s;opacity:.75}
.cloud.six{top:40%;left:-300px;transform:scale(1);animation-duration:78s;animation-delay:-55s;opacity:.58}
.cloud.extra-one{top:18%;left:-260px;transform:scale(.55);animation-duration:66s;animation-delay:-12s;opacity:.54}
.cloud.extra-two{top:42%;left:-300px;transform:scale(.82);animation-duration:84s;animation-delay:-34s;opacity:.48}
.cloud.extra-three{top:58%;left:-280px;transform:scale(.62);animation-duration:72s;animation-delay:-48s;opacity:.50}
.cloud.extra-four{top:76%;left:-360px;transform:scale(1.05);animation-duration:96s;animation-delay:-26s;opacity:.42}
.cloud.extra-five{top:7%;left:-230px;transform:scale(.42);animation-duration:58s;animation-delay:-41s;opacity:.46}
@keyframes cloudDrift{from{margin-left:-380px}to{margin-left:calc(100vw + 520px)}}

/* Sidebar */
.side-menu{
  position:fixed;left:20px;top:50%;transform:translateY(-50%);width:170px;
  display:flex;flex-direction:column;gap:12px;z-index:30;
}
.side-menu a{
  background:white;color:#1f2937;text-decoration:none;font-weight:800;text-align:center;
  padding:12px 16px;border-radius:999px;border:3px solid #bfdbfe;
  box-shadow:0 6px 14px rgba(0,0,0,.15);
}
.side-menu a:hover{background:#eef6ff}
.sidebar-logo-link{background:transparent!important;border:0!important;box-shadow:none!important;padding:0!important}
.sidebar-logo{
  width:170px;padding:16px 12px 18px;background:linear-gradient(180deg,#fff 0%,#fff7d6 100%);
  border-radius:28px;box-shadow:0 7px 16px rgba(0,0,0,.16),0 7px 0 rgba(31,41,55,.10);
  transform:rotate(-1deg);overflow:hidden;
}
.sidebar-bright,.sidebar-arcade{display:flex;justify-content:center;align-items:center;white-space:nowrap}
.sidebar-bright span{
  font-family:"Baloo 2","Fredoka",Arial,sans-serif;font-weight:800;font-size:1.72rem;line-height:.9;
  color:var(--c);text-shadow:2px 2px 0 rgba(6,25,70,.16);
}
.sidebar-arcade{
  margin-top:7px;font-family:"Baloo 2","Fredoka",Arial,sans-serif;font-weight:800;
  font-size:2rem;line-height:.82;color:var(--navy);text-shadow:2px 2px 0 rgba(6,25,70,.16);
}

/* Header */
.game{width:min(1080px,calc(100% - 220px));margin:0 0 0 220px;padding:22px 18px 46px}
.header{
  text-align:center;margin:0 0 18px;display:flex;flex-direction:column;align-items:center;gap:8px;
}
.title-wrap{
  display:flex;align-items:center;justify-content:center;gap:12px;
  animation:titleFloat 4s ease-in-out infinite;
}
.title-digits{display:flex;align-items:center;justify-content:center}
.title-digit{
  --c:#fff;display:inline-block;font-family:"Baloo 2","Fredoka",Arial,sans-serif;
  font-size:clamp(5rem,12vw,8.5rem);font-weight:800;line-height:.78;letter-spacing:-5px;
  color:var(--c);-webkit-text-stroke:7px #000;paint-order:stroke fill;
  text-shadow:0 6px 0 rgba(0,0,0,.34),0 13px 20px rgba(0,0,0,.22);
  transform:rotate(var(--r));animation:digitWiggle 2.2s ease-in-out infinite;animation-delay:var(--d);
}
.title-icon{
  display:inline-block;
  color:var(--green);font-family:"Baloo 2";font-size:3.6rem;font-weight:800;line-height:1;
  filter:drop-shadow(0 5px 0 rgba(6,25,70,.16));animation:iconBob 1.7s ease-in-out infinite;
}
.title-icon.target{font-size:3rem;color:var(--red);animation-delay:.35s}
@keyframes titleFloat{0%,100%{transform:translateY(0) rotate(-.3deg)}50%{transform:translateY(-5px) rotate(.3deg)}}
@keyframes digitWiggle{0%,100%{transform:rotate(var(--r)) translateY(0)}50%{transform:rotate(calc(var(--r) * -1)) translateY(-4px)}}
@keyframes iconBob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-7px) rotate(6deg) scale(1.04)}}
.subtitle{
  display:block;width:max-content;max-width:min(92vw,560px);margin:0 auto;padding:8px 16px;
  border:2px solid rgba(255,255,255,.96);border-radius:999px;background:rgba(255,255,255,.88);
  color:#24567c;font-size:1rem;font-weight:800;box-shadow:0 7px 18px rgba(6,25,70,.09);
}
.sound-toggle{
  border:2px solid rgba(255,255,255,.96);border-radius:999px;background:rgba(255,255,255,.91);
  color:var(--navy);font-weight:800;padding:8px 14px;cursor:pointer;box-shadow:0 6px 14px rgba(6,25,70,.09);
}
.sound-toggle:hover{background:#eef6ff}

/* Main shell */
.card{
  position:relative;overflow:hidden;background:rgba(255,255,255,.965);border:5px solid white;
  border-radius:34px;padding:24px;box-shadow:0 20px 44px rgba(15,23,42,.19);
}
.card::before{
  content:"";position:absolute;left:0;right:0;top:0;height:8px;
  background:linear-gradient(90deg,var(--red) 0 16.6%,var(--orange) 16.6% 33.2%,var(--yellow) 33.2% 49.8%,var(--green) 49.8% 66.4%,var(--blue) 66.4% 83%,var(--purple) 83%);
}
.screen{display:none;position:relative;z-index:1}.screen.active{display:block}
.instructions{
  text-align:center;max-width:820px;margin:6px auto 18px;color:#475569;font-size:1.06rem;
  line-height:1.5;font-weight:700;
}

/* Menu */
.mode-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;max-width:820px;margin:22px auto}
.choice{
  position:relative;border:3px solid #bfdcff;border-radius:25px;background:linear-gradient(180deg,#fff,#f2f8ff);
  padding:24px 16px;font-size:1.16rem;font-weight:900;color:#1e3a8a;cursor:pointer;
  box-shadow:0 7px 0 #d6e8fb,0 12px 18px rgba(6,25,70,.05);transition:.16s;overflow:hidden;
}
.choice::before{
  content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,0));pointer-events:none;
}
.choice .mode-icon{display:block;font-size:2.6rem;margin-bottom:8px}
.choice small{display:block;margin-top:6px;color:#64748b;font-weight:700;line-height:1.35}
.choice:hover{transform:translateY(-3px);border-color:#93c5fd;box-shadow:0 8px 0 #b9d9fa,0 14px 22px rgba(6,25,70,.08)}
.choice.selected{
  background:linear-gradient(180deg,#4aa4ff,#1f7cf8);border-color:#1d6de6;box-shadow:0 8px 0 #1659bc,0 16px 24px rgba(31,124,248,.18);color:#fff;
}
.choice.selected small{color:rgba(255,255,255,.92)}
.choice.selected::after{
  content:"✓";position:absolute;right:13px;top:13px;width:28px;height:28px;border-radius:50%;
  display:grid;place-items:center;background:white;color:#1f7cf8;font-size:.9rem;border:3px solid white;
  box-shadow:0 3px 8px rgba(6,25,70,.18);
}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:20px}
.primary,.secondary{
  border:0;border-radius:16px;padding:14px 24px;font-weight:900;font-size:1rem;cursor:pointer;
}
.primary{
  background:linear-gradient(180deg,#ff315f,var(--red));color:white;font-size:1.1rem;
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.20),0 7px 0 rgba(6,25,70,.14);
}
.secondary{background:#eef6ff;color:#334155;border:2px solid #d5e4f5}
.primary:hover,.secondary:hover{transform:translateY(-2px)}

/* Game */
.play-area{display:grid;grid-template-columns:1.12fr .88fr;gap:18px;align-items:start}
.total-card{
  grid-column:1/-1;position:relative;overflow:hidden;text-align:center;
  background:
    radial-gradient(circle at 14% 22%,rgba(255,255,255,.85) 0 5%,transparent 5.5%),
    radial-gradient(circle at 87% 72%,rgba(255,255,255,.62) 0 6%,transparent 6.5%),
    linear-gradient(135deg,#eef8ff 0%,#dff1ff 52%,#f5fbff 100%);
  border:5px solid var(--navy);border-radius:34px;padding:19px 22px 22px;
  box-shadow:0 10px 0 rgba(6,25,70,.16),inset 0 6px 0 rgba(255,255,255,.68);
}
.total-label{font-weight:900;color:#53667e;font-size:.98rem;text-transform:uppercase;letter-spacing:.06em}
.total-number{
  display:inline-block;font-family:"Baloo 2","Fredoka",Arial,sans-serif;font-size:clamp(5.2rem,13vw,8rem);
  line-height:.82;font-weight:800;color:#7030d8;-webkit-text-stroke:5px var(--navy);paint-order:stroke fill;
  text-shadow:0 7px 0 rgba(255,255,255,.68),0 12px 18px rgba(6,25,70,.15);
  transform-origin:center;
}
.total-number.bump{animation:totalBump .48s cubic-bezier(.2,.8,.25,1)}
@keyframes totalBump{0%{transform:scale(.88)}35%{transform:scale(1.12) rotate(1deg)}65%{transform:scale(.98) rotate(-.5deg)}100%{transform:scale(1)}}
.last-equation{
  min-height:30px;margin:7px 0 4px;font-family:"Baloo 2";font-weight:800;font-size:1.25rem;color:#34516f;
}

.panel{
  background:linear-gradient(180deg,#ffffff,#f5faff);border:3px solid #dbeafe;border-radius:27px;padding:18px;
  box-shadow:0 7px 18px rgba(6,25,70,.06);
}
.panel h2{
  margin:0 0 10px;font-family:"Baloo 2","Fredoka",Arial,sans-serif;font-size:1.8rem;
  color:#1e3a8a;text-align:center;
}
.turn-banner{
  text-align:center;margin-bottom:14px;font-size:1.22rem;font-weight:900;color:#5b21b6;
  min-height:30px;
}
.turn-banner.thinking{animation:thinkingPulse .75s ease-in-out infinite alternate}
@keyframes thinkingPulse{to{opacity:.58;transform:scale(.98)}}
.move-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.move-btn{
  --btn:#0875f5;border:3px solid var(--navy);border-radius:18px;
  background:linear-gradient(180deg,#fff 0%,color-mix(in srgb,var(--btn) 18%,white) 100%);
  box-shadow:0 6px 0 rgba(6,25,70,.19),inset 0 4px 0 rgba(255,255,255,.5);
  color:var(--navy);font-family:"Baloo 2","Fredoka",Arial,sans-serif;font-size:1.8rem;
  font-weight:800;padding:12px 4px;cursor:pointer;transition:.12s;
}
.move-btn:nth-child(6n+1){--btn:#ef174d}.move-btn:nth-child(6n+2){--btn:#f97316}
.move-btn:nth-child(6n+3){--btn:#facc15}.move-btn:nth-child(6n+4){--btn:#ef4444}
.move-btn:nth-child(6n+5){--btn:#0875f5}.move-btn:nth-child(6n+6){--btn:#7030d8}
.move-btn:hover:not(:disabled){transform:translateY(-3px) scale(1.025);filter:saturate(1.12)}
.move-btn:disabled{opacity:.34;cursor:not-allowed;filter:grayscale(.35)}
.message{text-align:center;min-height:28px;margin-top:12px;font-weight:800;color:#52708e}

.log{
  min-height:270px;max-height:330px;overflow:auto;display:flex;flex-direction:column-reverse;gap:8px;padding:3px;
}
.log-empty{color:#94a3b8;text-align:center;font-weight:700;padding:30px 8px}
.log-entry{
  background:white;border:2px solid #cfe1f4;border-radius:16px;padding:10px 12px;font-weight:800;color:#334155;
  animation:logIn .28s ease-out;
}
.log-entry.player{border-color:#86efac;background:#f0fdf4}
.log-entry.computer{border-color:#fdba74;background:#fff7ed}
.log-entry.win{border-color:#fda4af;background:#fff1f2;color:#9f1239}
@keyframes logIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

/* Flying addition token */
.floating-add{
  position:fixed;z-index:1000;left:0;top:0;display:grid;place-items:center;min-width:82px;height:68px;
  padding:0 18px;border-radius:22px;border:5px solid var(--navy);
  font-family:"Baloo 2","Fredoka",Arial,sans-serif;font-size:2.7rem;font-weight:800;line-height:1;
  color:white;pointer-events:none;box-shadow:0 8px 0 rgba(6,25,70,.22),0 14px 25px rgba(6,25,70,.22);
  transform:translate(-50%,-50%);
}
.floating-add.player{background:linear-gradient(145deg,#4ade80,#dc2626)}
.floating-add.computer{background:linear-gradient(145deg,#fb923c,#ea580c)}
.floating-add.p2{background:linear-gradient(145deg,#60a5fa,#2563eb)}
.landing-ring{
  position:fixed;z-index:999;width:40px;height:40px;border:5px solid var(--yellow);border-radius:50%;
  pointer-events:none;transform:translate(-50%,-50%);animation:ringBurst .45s ease-out forwards;
}
@keyframes ringBurst{to{width:150px;height:150px;opacity:0;border-width:2px}}

/* Results */
.results{
  position:relative;overflow:hidden;text-align:center;background:linear-gradient(135deg,#f7fbff 0%,#e9f4ff 52%,#dff1ff 100%);
  border:5px solid var(--navy);border-radius:32px;padding:30px;box-shadow:0 10px 0 rgba(6,25,70,.18);
}
.results h2{
  font-family:"Baloo 2","Fredoka",Arial,sans-serif;font-size:clamp(2.8rem,7vw,5rem);
  line-height:.9;margin:0;color:#1d4ed8;
}
.result-100{
  margin:14px auto 4px;font-family:"Baloo 2";font-size:clamp(4rem,10vw,7rem);line-height:.9;
  color:#facc15;-webkit-text-stroke:5px var(--navy);paint-order:stroke fill;
}
.result-details{font-size:1.15rem;font-weight:800;color:#475569;line-height:1.6;margin-top:12px}
.confetti{
  position:absolute;width:10px;height:18px;border-radius:3px;background:var(--c);
  animation:confettiDrop 1.5s ease-out forwards;pointer-events:none;
}
@keyframes confettiDrop{
  from{transform:translateY(-60px) rotate(0);opacity:1}
  to{transform:translate(var(--x),320px) rotate(var(--r));opacity:0}
}

@media(max-width:900px){
  .side-menu{position:static;transform:none;width:auto;flex-direction:row;justify-content:center;margin:12px auto}
  .sidebar-logo{display:none}.game{width:100%;margin-left:0;padding-top:8px}
}
@media(max-width:720px){
  .play-area{grid-template-columns:1fr}.mode-grid{grid-template-columns:1fr}
  .title-icon{font-size:2.5rem}
  .title-icon.target{font-size:2.15rem}.title-digit{font-size:clamp(4rem,20vw,6.2rem);-webkit-text-stroke-width:5px}
}
@media(max-width:520px){
  .game{padding:8px 10px 34px}.card{padding:14px 10px 18px;border-radius:25px}
  .title-wrap{gap:5px}.title-icon{font-size:2rem}
  .title-icon.target{font-size:1.75rem}.title-digit{font-size:clamp(3.5rem,21vw,5.2rem);-webkit-text-stroke-width:4px;letter-spacing:-4px}
  .move-grid{gap:7px}.move-btn{font-size:1.35rem;border-width:2px;border-radius:14px;padding:11px 2px}
  .total-number{font-size:5rem;-webkit-text-stroke-width:4px}
  .primary,.secondary{width:100%}.floating-add{min-width:68px;height:58px;font-size:2.25rem;border-width:4px}
}
</style>
</head>
<body>
<div class="sky-background" aria-hidden="true">
  <div class="cloud one"></div><div class="cloud two"></div><div class="cloud three"></div>
  <div class="cloud four"></div><div class="cloud five"></div><div class="cloud six"></div>
  <div class="cloud extra-one"></div><div class="cloud extra-two"></div><div class="cloud extra-three"></div>
  <div class="cloud extra-four"></div><div class="cloud extra-five"></div>
</div>

<nav class="side-menu">
  <a href="/" class="sidebar-logo-link" aria-label="Bright Arcade Home">
    <div class="sidebar-logo">
      <div class="sidebar-bright">
        <span style="--c:#ef174d;">B</span><span style="--c:#f97316;">R</span><span style="--c:#facc15;">I</span>
        <span style="--c:#49c600;">G</span><span style="--c:#0875f5;">H</span><span style="--c:#7030d8;">T</span>
      </div>
      <div class="sidebar-arcade">ARCADE</div>
    </div>
  </a>
  <a href="/">Home</a>
</nav>

<div class="game">
  <header class="header">
    <div class="title-wrap" aria-label="100">
      <span class="title-icon" aria-hidden="true">+</span>
      <div class="title-digits" aria-hidden="true">
        <span class="title-digit" style="--c:#d4af37;--r:-2deg;--d:0s">1</span>
        <span class="title-digit" style="--c:#d4af37;--r:1deg;--d:.10s">0</span>
        <span class="title-digit" style="--c:#d4af37;--r:-1deg;--d:.20s">0</span>
      </div>
      <span class="title-icon target" aria-hidden="true">🎯</span>
    </div>
    <p class="subtitle">Be the first to say 100!</p>
    <button type="button" class="sound-toggle" id="soundToggle">🔊 Sound + Music On</button>
  </header>

  <main class="card">
    <section class="screen active" id="startScreen">
      <p class="instructions">Start at 0. On each turn, add a number from 1 to 10. The player who reaches exactly 100 wins.</p>
      <div class="mode-grid">
        <button type="button" class="choice selected" data-mode="computer">
          <span class="mode-icon">🤖</span>Player vs Computer
          <small>The computer goes first and changes its style each game.</small>
        </button>
        <button type="button" class="choice" data-mode="two">
          <span class="mode-icon">👥</span>Two Player
          <small>Take turns on the same screen.</small>
        </button>
      </div>
      <div class="actions"><button type="button" class="primary" id="startBtn">Start Game</button></div>
    </section>

    <section class="screen" id="gameScreen">
      <div class="play-area">
        <section class="total-card">
          <div class="total-label">Current Total</div>
          <div class="total-number" id="totalNumber">0</div>
          <div class="last-equation" id="lastEquation">Race to exactly 100!</div>
        </section>

        <section class="panel move-panel">
          <h2>Your Move</h2>
          <div class="turn-banner" id="turnBanner">Choose a number to add.</div>
          <div class="move-grid" id="moveGrid"></div>
          <div class="message" id="message">Add 1 to 10.</div>
        </section>

        <section class="panel log-panel">
          <h2>Game Log</h2>
          <div class="log" id="log"><div class="log-empty" id="logEmpty">Moves will appear here.</div></div>
        </section>
      </div>

      <div class="actions">
        <button type="button" class="secondary" id="restartBtn">Restart</button>
        <button type="button" class="secondary" id="menuBtn">Back to Menu</button>
      </div>
    </section>

    <section class="screen" id="resultScreen">
      <div class="results" id="resultsBox">
        <h2 id="resultTitle">You Win!</h2>
        <div class="result-100">100!</div>
        <div class="result-details" id="resultDetails"></div>
      </div>
      <div class="actions">
        <button type="button" class="primary" id="playAgainBtn">Play Again</button>
        <button type="button" class="secondary" id="chooseModeBtn">Choose Mode</button>
      </div>
    </section>
  </main>
</div>

<script>
const TARGET=100,MAX_ADD=10,MAGIC_STEP=11;
const keyNumbers=[1,12,23,34,45,56,67,78,89,100];

let mode="computer",total=0,turn="player",gameOver=false,moves=[];
let computerStyle="average",computerSwitchPoint=56,animating=false,computerTimer=null;
let soundOn=localStorage.getItem("hundredSound")!=="off";

const startScreen=document.getElementById("startScreen");
const gameScreen=document.getElementById("gameScreen");
const resultScreen=document.getElementById("resultScreen");
const totalNumber=document.getElementById("totalNumber");
const lastEquation=document.getElementById("lastEquation");
const moveGrid=document.getElementById("moveGrid");
const turnBanner=document.getElementById("turnBanner");
const message=document.getElementById("message");
const log=document.getElementById("log");
const resultTitle=document.getElementById("resultTitle");
const resultDetails=document.getElementById("resultDetails");
const soundToggle=document.getElementById("soundToggle");
const resultsBox=document.getElementById("resultsBox");

function showScreen(screen){
  startScreen.classList.remove("active");gameScreen.classList.remove("active");resultScreen.classList.remove("active");
  screen.classList.add("active");
}
function buildMoves(){
  moveGrid.innerHTML="";
  for(let i=1;i<=MAX_ADD;i++){
    const b=document.createElement("button");
    b.type="button";b.className="move-btn";b.textContent="+"+i;b.dataset.value=i;
    b.addEventListener("click",()=>playerMove(i,b));
    moveGrid.appendChild(b);
  }
}
function setButtonsEnabled(enabled){
  document.querySelectorAll(".move-btn").forEach(btn=>{
    const value=Number(btn.dataset.value);
    btn.disabled=!enabled||gameOver||animating||total+value>TARGET;
  });
}
function updateDisplay(updateNumber=true){
  if(updateNumber)totalNumber.textContent=total;
  if(gameOver){setButtonsEnabled(false);turnBanner.classList.remove("thinking");return}
  if(mode==="two"){
    turnBanner.classList.remove("thinking");
    turnBanner.textContent=turn==="player"?"Player 1's turn":"Player 2's turn";
    message.textContent="Choose a number from 1 to 10.";
    setButtonsEnabled(!animating);
  }else if(turn==="player"){
    turnBanner.classList.remove("thinking");
    turnBanner.textContent="Your turn";
    message.textContent="Choose a number from 1 to 10.";
    setButtonsEnabled(!animating);
  }else{
    turnBanner.textContent="Computer is thinking...";
    turnBanner.classList.add("thinking");
    message.textContent="Wait for the computer.";
    setButtonsEnabled(false);
  }
}
function addLog(text,type){
  const empty=document.getElementById("logEmpty");if(empty)empty.remove();
  const entry=document.createElement("div");entry.className="log-entry "+(type||"");entry.textContent=text;log.prepend(entry);
}

/* ---------- Audio feedback ---------- */
let audioCtx=null,masterGain=null,musicGain=null,musicTimer=null,musicStep=0;
function ensureAudio(){
  if(audioCtx){if(audioCtx.state==="suspended")audioCtx.resume();return}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  audioCtx=new AC();
  masterGain=audioCtx.createGain();masterGain.gain.value=soundOn?1:0;masterGain.connect(audioCtx.destination);
  musicGain=audioCtx.createGain();musicGain.gain.value=.082;musicGain.connect(masterGain);
}
function tone(freq,dur=.12,type="sine",gain=.07,delay=0,endFreq=null){
  if(!soundOn)return;ensureAudio();if(!audioCtx)return;
  const t=audioCtx.currentTime+delay,o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);
  if(endFreq)o.frequency.exponentialRampToValueAtTime(Math.max(30,endFreq),t+dur);
  g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(gain,t+.012);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(masterGain);o.start(t);o.stop(t+dur+.025);
}
function musicTone(freq,dur=.30,type="triangle",gain=.025,delay=0){
  if(!soundOn)return;ensureAudio();if(!audioCtx||!musicGain)return;
  const t=audioCtx.currentTime+delay,o=audioCtx.createOscillator(),g=audioCtx.createGain(),f=audioCtx.createBiquadFilter();
  o.type=type;o.frequency.setValueAtTime(freq,t);
  f.type="lowpass";f.frequency.setValueAtTime(1450,t);
  g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(gain,t+.018);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(f);f.connect(g);g.connect(musicGain);o.start(t);o.stop(t+dur+.03);
}
// Repeating puzzle-style ostinato: steady and focused rather than song-like.
const focusPattern=[392,440,494,440,392,440,523,494,440,392,349,392,440,494,440,392];
const focusBass=[196,196,220,220,175,175,196,196];
function musicTick(){
  if(!soundOn||!gameScreen.classList.contains("active")||gameOver)return;
  const note=focusPattern[musicStep%focusPattern.length];

  // Main soft plucked pulse.
  musicTone(note,.30,"triangle",.044);

  // Low alternating pulse keeps a calm sense of movement.
  if(musicStep%2===0){
    musicTone(focusBass[Math.floor(musicStep/2)%focusBass.length],.48,"sine",.028,.01);
  }

  // Quiet upper note every fourth beat gives the "thinking" loop a little lift.
  if(musicStep%4===2){
    musicTone(note*1.5,.18,"sine",.014,.08);
  }

  // Very soft clock-like cue, more noticeable as rhythm than melody.
  if(musicStep%2===1){
    musicTone(880,.055,"sine",.007,.03);
  }

  musicStep++;
}
function startMusic(){
  stopMusic();if(!soundOn)return;ensureAudio();musicStep=0;musicTick();musicTimer=setInterval(musicTick,410);
}
function stopMusic(){if(musicTimer)clearInterval(musicTimer);musicTimer=null;}
function moveSound(who,amount){
  const base=who==="computer"?310:who==="computer2"?365:420;
  tone(base+amount*13,.09,"triangle",.045);
  tone((base+amount*13)*1.35,.10,"sine",.025,.045);
}
function landSound(newTotal){
  const lift=1+newTotal/250;
  tone(520*lift,.10,"triangle",.055);
  tone(690*lift,.14,"sine",.045,.055);
}
function winSound(){
  [523,659,784,1046].forEach((f,i)=>tone(f,.20,"triangle",.065,i*.10));
  tone(1318,.34,"sine",.045,.37);
}
function updateSoundButton(){soundToggle.textContent=soundOn?"🔊 Sound + Music On":"🔇 Sound + Music Off"}
soundToggle.addEventListener("click",()=>{
  soundOn=!soundOn;localStorage.setItem("hundredSound",soundOn?"on":"off");ensureAudio();
  if(masterGain&&audioCtx)masterGain.gain.setTargetAtTime(soundOn?1:0,audioCtx.currentTime,.03);
  updateSoundButton();
  if(soundOn&&gameScreen.classList.contains("active")&&!gameOver)startMusic();else stopMusic();
});
updateSoundButton();
document.addEventListener("visibilitychange",()=>{
  if(document.hidden)stopMusic();
  else if(soundOn&&gameScreen.classList.contains("active")&&!gameOver)startMusic();
});

/* ---------- Move animation ---------- */
function tokenClass(who){
  if(mode==="two"&&who==="computer")return "p2";
  return who==="computer"?"computer":"player";
}
function sourceForComputer(){return turnBanner}
function animateToken(amount,who,sourceEl,onLand){
  const sourceRect=(sourceEl||turnBanner).getBoundingClientRect();
  const targetRect=totalNumber.getBoundingClientRect();
  const sx=sourceRect.left+sourceRect.width/2,sy=sourceRect.top+sourceRect.height/2;
  const tx=targetRect.left+targetRect.width/2,ty=targetRect.top+targetRect.height/2;

  const token=document.createElement("div");
  token.className="floating-add "+tokenClass(who);token.textContent="+"+amount;
  token.style.left=sx+"px";token.style.top=sy+"px";document.body.appendChild(token);

  moveSound(who,amount);

  const dx=tx-sx,dy=ty-sy;
  const animation=token.animate([
    {transform:"translate(-50%,-50%) scale(.72) rotate(-7deg)",opacity:0},
    {transform:"translate(-50%,-65%) scale(1.08) rotate(3deg)",opacity:1,offset:.24},
    {transform:`translate(calc(-50% + ${dx*.72}px), calc(-50% + ${dy*.72-32}px)) scale(1.05) rotate(-2deg)`,opacity:1,offset:.70},
    {transform:`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(.42) rotate(0deg)`,opacity:.15}
  ],{duration:650,easing:"cubic-bezier(.18,.8,.22,1)",fill:"forwards"});

  animation.onfinish=()=>{
    token.remove();
    const ring=document.createElement("div");ring.className="landing-ring";ring.style.left=tx+"px";ring.style.top=ty+"px";
    document.body.appendChild(ring);setTimeout(()=>ring.remove(),480);
    onLand();
  };
}
function animateCount(from,to,duration=360){
  const started=performance.now();
  function step(now){
    const t=Math.min(1,(now-started)/duration);
    const eased=1-Math.pow(1-t,3);
    totalNumber.textContent=Math.round(from+(to-from)*eased);
    if(t<1)requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function pulseTotal(){
  totalNumber.classList.remove("bump");void totalNumber.offsetWidth;totalNumber.classList.add("bump");
}
function addMove(amount,who,sourceEl){
  if(gameOver||animating)return;
  const oldTotal=total,newTotal=total+amount;if(newTotal>TARGET)return;
  animating=true;setButtonsEnabled(false);
  message.textContent=who==="computer"&&mode==="computer"?"Computer adds "+amount+"…":"Adding "+amount+"…";

  animateToken(amount,who,sourceEl,()=>{
    total=newTotal;
    moves.push({who,amount,total});
    animateCount(oldTotal,newTotal);
    lastEquation.textContent=`${oldTotal} + ${amount} = ${newTotal}`;
    pulseTotal();landSound(newTotal);

    if(who==="computer"){
      addLog("Computer adds "+amount+" → "+newTotal,"computer");
    }else if(mode==="two"){
      addLog((who==="player"?"Player 1":"Player 2")+" adds "+amount+" → "+newTotal,"player");
    }else{
      addLog("You add "+amount+" → "+newTotal,"player");
    }

    setTimeout(()=>{
      animating=false;
      if(total>=TARGET){finishGame(who);return}
      if(mode==="two"){
        turn=turn==="player"?"computer":"player";updateDisplay(false);
      }else{
        turn=who==="player"?"computer":"player";updateDisplay(false);
        if(turn==="computer"){
          clearTimeout(computerTimer);computerTimer=setTimeout(computerMove,720);
        }
      }
    },430);
  });
}
function playerMove(amount,sourceBtn){
  if(gameOver||animating)return;
  if(mode==="computer"&&turn!=="player")return;
  if(total+amount>TARGET)return;
  addMove(amount,turn,sourceBtn);
}
function computerMove(){
  if(gameOver||animating||mode!=="computer")return;
  const amount=chooseComputerMove();
  addMove(amount,"computer",sourceForComputer());
}

function chooseComputerMove(){
 const remaining=TARGET-total;
 if(remaining<=MAX_ADD)return remaining;

 const legalMoves=[];
 for(let i=1;i<=MAX_ADD;i++){
   if(total+i<=TARGET)legalMoves.push(i);
 }

 // Includes 1,12,23,34,45,56,67,78,89.
 // Non-strategy modes avoid these so the computer does not start the winning sequence.
 const keyTargets=keyNumbers.filter(n=>n<TARGET);

 function pick(pool){
   return pool[Math.floor(Math.random()*pool.length)];
 }

 function randomMove(){
   return pick(legalMoves);
 }

 function avoidsKeyMove(){
   const nonKey=legalMoves.filter(n=>!keyTargets.includes(total+n));
   return pick(nonKey.length?nonKey:legalMoves);
 }

 function sensibleMove(){
   const safer=legalMoves.filter(n=>{
     const newTotal=total+n;
     return TARGET-newTotal>MAX_ADD&&!keyTargets.includes(newTotal);
   });
   return safer.length?pick(safer):avoidsKeyMove();
 }

 function strategicMove(){
   const possibleKeys=keyNumbers.filter(n=>n>total&&n<TARGET&&n-total>=1&&n-total<=MAX_ADD);
   if(possibleKeys.length)return possibleKeys[0]-total;

   const last=moves[moves.length-1];
   if(last&&last.who==="player"){
     const reply=MAGIC_STEP-last.amount;
     if(reply>=1&&reply<=MAX_ADD&&total+reply<=TARGET)return reply;
   }
   return sensibleMove();
 }

 // Computer always goes first. It may open with 1, but not every time.
 // Stronger hidden styles are more likely to notice that 1 is a useful opening.
 if(total===0){
   if(computerStyle==="beginner"){
     return Math.random()<0.08 ? 1 : avoidsKeyMove();
   }
   if(computerStyle==="average"){
     return Math.random()<0.18 ? 1 : avoidsKeyMove();
   }
   if(computerStyle==="sharp"){
     return Math.random()<0.35 ? 1 : avoidsKeyMove();
   }
   return Math.random()<0.55 ? 1 : avoidsKeyMove();
 }

 if(computerStyle==="beginner"){
   return Math.random()<0.75?avoidsKeyMove():randomMove();
 }

 if(computerStyle==="average"){
   return Math.random()<0.80?sensibleMove():avoidsKeyMove();
 }

 if(computerStyle==="sharp"){
   if(total<computerSwitchPoint)return Math.random()<0.80?sensibleMove():avoidsKeyMove();
   return Math.random()<0.38?strategicMove():sensibleMove();
 }

 // Expert is rare and only switches to strategy later.
 if(total<computerSwitchPoint)return Math.random()<0.70?sensibleMove():avoidsKeyMove();
 return Math.random()<0.55?strategicMove():sensibleMove();
}

function makeConfetti(){
  const colours=["#ef174d","#f97316","#facc15","#ef4444","#0875f5","#7030d8"];
  for(let i=0;i<45;i++){
    const c=document.createElement("span");c.className="confetti";c.style.setProperty("--c",colours[i%colours.length]);
    c.style.left=(5+Math.random()*90)+"%";c.style.top="-30px";
    c.style.setProperty("--x",(Math.random()*180-90)+"px");c.style.setProperty("--r",(Math.random()*720-360)+"deg");
    c.style.animationDelay=(Math.random()*.35)+"s";resultsBox.appendChild(c);setTimeout(()=>c.remove(),2200);
  }
}
function finishGame(winner){
  stopMusic();
  gameOver=true;animating=false;updateDisplay(false);
  let title;
  if(mode==="two")title=winner==="player"?"Player 1 Wins!":"Player 2 Wins!";
  else title=winner==="player"?"You Win!":"Computer Wins!";
  resultTitle.textContent=title;
  resultDetails.textContent="The final total was 100 after "+moves.length+" moves.";
  addLog(title+" Reached 100.","win");
  winSound();
  setTimeout(()=>{showScreen(resultScreen);makeConfetti()},650);
}
function startGame(){
  clearTimeout(computerTimer);stopMusic();
  total=0;gameOver=false;animating=false;moves=[];log.innerHTML='<div class="log-empty" id="logEmpty">Moves will appear here.</div>';
  totalNumber.textContent="0";lastEquation.textContent="Race to exactly 100!";

  const styleRoll=Math.random();
  if(styleRoll<0.55)computerStyle="beginner";
  else if(styleRoll<0.85)computerStyle="average";
  else if(styleRoll<0.97)computerStyle="sharp";
  else computerStyle="expert";

  computerSwitchPoint=[45,56,67][Math.floor(Math.random()*3)];
  turn=mode==="computer"?"computer":"player";
  showScreen(gameScreen);updateDisplay();
  ensureAudio();startMusic();
  if(mode==="computer")computerTimer=setTimeout(computerMove,780);
}
function backToMenu(){
  clearTimeout(computerTimer);stopMusic();animating=false;showScreen(startScreen);
}
document.querySelectorAll(".choice").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".choice").forEach(b=>b.classList.remove("selected"));
    btn.classList.add("selected");mode=btn.dataset.mode;
  });
});
document.getElementById("startBtn").addEventListener("click",startGame);
document.getElementById("restartBtn").addEventListener("click",startGame);
document.getElementById("menuBtn").addEventListener("click",backToMenu);
document.getElementById("playAgainBtn").addEventListener("click",startGame);
document.getElementById("chooseModeBtn").addEventListener("click",backToMenu);
buildMoves();
</script>
